apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-u04-config-and-secrets
  labels:
    academy.dcs/track: core
    academy.dcs/order: "110"
    # Console lab: the portal allocates this session for the namespace + objects
    # below, then redirects the learner into the OpenShift console instead of the
    # workshop dashboard. The academy console plugin guides them from there.
    academy.dcs/lab-format: console
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/display-name: "Config & secrets (console)"
    academy.dcs/duration: "10 min"
    academy.dcs/difficulty: beginner
    academy.dcs/icon: monitor
    academy.dcs/summary: >-
      Find the ConfigMap and Secret an application runs on in the OpenShift web
      console, and the workload that consumes them.
    # A console lab has no workshop content, so there is no README for the portal to
    # fetch: this annotation is the course page's prospectus. Markdown, rendered.
    academy.dcs/details: |
      ### What this lab is

      A **console lab**. Instead of a terminal and instruction pages, the lab opens the
      OpenShift web console and walks you through it: the step you are on is highlighted
      on the real page, and the guidance box follows you as you navigate.

      Your own project is created before the lab starts, holding a ConfigMap, a Secret and
      a Deployment that reads both — the same arrangement you built from the terminal.

      ### What you should already know

      This lab assumes the concepts, not the clicks. You should have finished
      **Configure & Troubleshoot Your App**, where you moved configuration into a
      ConfigMap and a Secret and rolled the change out. No new Kubernetes concepts are
      introduced here.

      ### What you will do

      You will not type any commands — this lab is entirely in the console. Each screen names
      the command it replaces, so you can map one onto the other afterwards.

      - Read the application config, values and YAML, where `oc get cm -o yaml` would print it
      - Reveal a Secret's values in one click, instead of decoding each key with `base64 -d`
      - See what that implies: base64 is encoding, not encryption
      - Find both objects named on the Deployment's Environment tab, the screen behind
        `oc set env --from`
      - Open the form the console edits that wiring in, and see why the change starts a rollout

      ### When to reach for the console

      The console wins when you want to see configuration and the workload that reads it
      side by side, without printing YAML. The CLI still wins for anything you need to
      repeat, script, or review — which is why the terminal labs come first.

      ### Cleaning up

      Press **Finish** in the guidance box when you are done. That records your completion
      and shuts the project down. Leaving the tab open just leaves it running until it
      expires.
    # The ConsoleLab CR (academy.dcs/v1alpha1, shipped by the console plugin repo)
    # this session drives. It templates only <<namespace>>, which the portal always
    # injects from the allocated session namespace, so there are no extra params.
    academy.dcs/console-lab: lab-u04-config-and-secrets
    # A console-lab learner never opens the workshop dashboard, so Educates would
    # see the session as orphaned and reclaim it out from under them. A zero
    # duration disables that timer; `expires` remains the real lifetime bound.
    # The CRD pattern is ^\d+(s|m|h)$, so it must carry a unit: 0s, not 0.
    academy.dcs/orphaned: "0s"
    academy.dcs/expires: 60m
spec:
  title: "Config & secrets (console)"
  description: >-
    You moved an application's configuration into a ConfigMap and a Secret from the
    terminal in Configure & Troubleshoot Your App. This lab finds the same objects in the
    OpenShift web console, shows what Reveal values really means, and ends on the
    Deployment tab that wires configuration into a workload.
  duration: 10m
  difficulty: beginner
  labels:
    - name: module
      value: "A-Foundations"
  workshop:
    # No content files: nobody opens the dashboard for a console lab, so there are
    # no instruction pages to fetch or publish. The session pod exists only to own
    # the namespace and its objects.
    image: "{{ .Values.workshopImages.base }}"
  session:
    namespaces:
      budget: medium
      security:
        token:
          enabled: true
    # Nothing to click through in the dashboard — the lab happens in the console.
    applications:
      terminal:
        enabled: false
      editor:
        enabled: false
      console:
        enabled: false
      slides:
        enabled: false
    objects:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: app-config
          namespace: $(session_namespace)
        data:
          GREETING: "Hello from a ConfigMap"
          MODE: "demo"
      # A demo value only. Educates renders this into the session namespace as written,
      # so nothing here may be a real credential.
      - apiVersion: v1
        kind: Secret
        metadata:
          name: app-secret
          namespace: $(session_namespace)
        stringData:
          API_TOKEN: "not-a-real-token"
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: lab-app
          namespace: $(session_namespace)
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: lab-app
          template:
            metadata:
              labels:
                app: lab-app
                # Makes the lab pods visible to the portal's readiness feed, which queries
                # this Educates session label — so the browser is not redirected to the
                # console before the workload the lab talks about is actually running.
                training.educates.dev/session.name: $(session_name)
            spec:
              containers:
                - name: app
                  image: "{{ .Values.workshopImages.sample }}"
                  # envFrom, not individual env entries: the Environment tab is the last
                  # step of the tour and it must show both objects attached as a whole.
                  envFrom:
                    - configMapRef:
                        name: app-config
                    - secretRef:
                        name: app-secret
                  ports:
                    - containerPort: 8080
                  resources:
                    requests:
                      cpu: 10m
                      memory: 64Mi
                    limits:
                      memory: 128Mi
