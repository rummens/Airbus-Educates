apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-u03-deployments-rollouts
  labels:
    academy.dcs/track: core
    academy.dcs/order: "100"
    # Console lab: the portal allocates this session for the namespace + objects
    # below, then redirects the learner into the OpenShift console instead of the
    # workshop dashboard. The academy console plugin guides them from there.
    academy.dcs/lab-format: console
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/display-name: "Deployments & rollouts (console)"
    academy.dcs/duration: "10 min"
    academy.dcs/difficulty: beginner
    academy.dcs/icon: monitor
    academy.dcs/summary: >-
      Read replicas, rollout history and events for a running Deployment in the
      OpenShift web console, guided step by step.
    # A console lab has no workshop content, so there is no README for the portal to
    # fetch: this annotation is the course page's prospectus. Markdown, rendered.
    academy.dcs/details: |
      ### What this lab is

      A **console lab**. Instead of a terminal and instruction pages, the lab opens the
      OpenShift web console and walks you through it: the step you are on is highlighted
      on the real page, and the guidance box follows you as you navigate.

      Your own project is created before the lab starts, with a Deployment already
      running two replicas, so every screen shows live data.

      ### What you should already know

      This lab assumes the concepts, not the clicks. You should have finished
      **Deploy Your First App**, where you created a Deployment and watched a rollout
      with `oc rollout status`. No new Kubernetes concepts are introduced here.

      ### What you will do

      You will not type any commands — this lab is entirely in the console. Each screen names
      the command it replaces, so you can map one onto the other afterwards.

      - Read desired versus available replicas where `oc get deployment` would report them
      - Find the replica control and the strategy, selector and status behind `oc describe`
      - List the pods this Deployment owns, already filtered by its own selector
      - Look at the ReplicaSet per revision — what `oc rollout history` and `undo` work on
      - Read the events, and the live YAML, and see why editing it here is not the same as
        changing the manifest in git
      - Open the Actions menu and the edit form behind it, the console's `oc set`

      ### When to reach for the console

      The console wins when you want the rollout state and the objects underneath it on one
      screen, updating on their own. The CLI still wins for anything you need to repeat,
      script, or review — which is why the terminal labs come first.

      ### Cleaning up

      Press **Finish** in the guidance box when you are done. That records your completion
      and shuts the project down. Leaving the tab open just leaves it running until it
      expires.
    # The ConsoleLab CR (academy.dcs/v1alpha1, shipped by the console plugin repo)
    # this session drives. It templates only <<namespace>>, which the portal always
    # injects from the allocated session namespace, so there are no extra params.
    academy.dcs/console-lab: lab-u03-deployments-rollouts
    # A console-lab learner never opens the workshop dashboard, so Educates would
    # see the session as orphaned and reclaim it out from under them. A zero
    # duration disables that timer; `expires` remains the real lifetime bound.
    # The CRD pattern is ^\d+(s|m|h)$, so it must carry a unit: 0s, not 0.
    academy.dcs/orphaned: "0s"
    academy.dcs/expires: 60m
spec:
  title: "Deployments & rollouts (console)"
  description: >-
    You created a Deployment and watched it roll out from the terminal in Deploy Your
    First App. This lab walks the same object through the OpenShift web console —
    replicas, owned pods, revision history, events and live YAML — so you can recognise
    each command's equivalent on screen.
  duration: 10m
  difficulty: beginner
  labels:
    - name: module
      value: "A-Foundations"
  workshop:
    # No content files: nobody opens the dashboard for a console lab, so there are
    # no instruction pages to fetch or publish. The session pod exists only to own
    # the namespace and its objects.
    image: "{{ .Values.workshopImages.base }}"
  session:
    namespaces:
      budget: medium
      security:
        token:
          enabled: true
    # Nothing to click through in the dashboard — the lab happens in the console.
    applications:
      terminal:
        enabled: false
      editor:
        enabled: false
      console:
        enabled: false
      slides:
        enabled: false
    objects:
      # A Deployment (not a bare Pod) is the subject of this tour, and its own name is
      # stable, so the lab can path-target it. Two replicas so the Pods tab and the
      # replica ring have something to show.
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: lab-app
          namespace: $(session_namespace)
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: lab-app
          template:
            metadata:
              labels:
                app: lab-app
                # Makes the lab pods visible to the portal's readiness feed, which queries
                # this Educates session label — so the browser is not redirected to the
                # console before the workload the lab talks about is actually running.
                training.educates.dev/session.name: $(session_name)
            spec:
              containers:
                - name: app
                  image: "{{ .Values.workshopImages.sample }}"
                  ports:
                    - containerPort: 8080
                  resources:
                    requests:
                      cpu: 10m
                      memory: 64Mi
                    limits:
                      memory: 128Mi
      - apiVersion: v1
        kind: Service
        metadata:
          name: lab-app
          namespace: $(session_namespace)
        spec:
          selector:
            app: lab-app
          ports:
            - port: 8080
              targetPort: 8080
