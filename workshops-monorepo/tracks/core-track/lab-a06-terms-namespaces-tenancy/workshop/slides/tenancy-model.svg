<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="sans-serif">
  <rect x="0" y="0" width="780" height="300" fill="#f5f7fa" stroke="#c5ced6"/>
  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2b3a">The DCS tenancy model: a Tenant owns its Namespaces</text>

  <!-- Tenant -->
  <rect x="290" y="44" width="200" height="58" rx="6" fill="#e8f0f7" stroke="#3b7dd8"/>
  <text x="390" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4a86">Tenant</text>
  <text x="390" y="88" text-anchor="middle" font-size="10" fill="#5a6b7b">org · accountable · recharged</text>

  <!-- arrows from Tenant to each Namespace -->
  <g stroke="#5a6b7b" stroke-width="2" fill="#5a6b7b">
    <line x1="390" y1="102" x2="140" y2="160"/><polygon points="140,160 141,151 148,157"/>
    <line x1="390" y1="102" x2="390" y2="160"/><polygon points="390,160 386,152 394,152"/>
    <line x1="390" y1="102" x2="640" y2="160"/><polygon points="640,160 632,157 639,151"/>
  </g>
  <text x="390" y="132" text-anchor="middle" font-size="9" fill="#8a97a4">owns one or more (no "project" layer in between)</text>

  <!-- Namespace DEV -->
  <rect x="40" y="162" width="200" height="92" rx="6" fill="#e8f0f7" stroke="#3b7dd8"/>
  <text x="140" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b4a86">Namespace (DEV)</text>
  <text x="140" y="208" text-anchor="middle" font-size="10" fill="#5a6b7b">development / testing</text>
  <text x="140" y="224" text-anchor="middle" font-size="10" fill="#5a6b7b">no policy enforcement</text>
  <text x="140" y="242" text-anchor="middle" font-size="9" fill="#8a97a4">looser, for fast iteration</text>

  <!-- Namespace DEV -->
  <rect x="290" y="162" width="200" height="92" rx="6" fill="#e8f0f7" stroke="#3b7dd8"/>
  <text x="390" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b4a86">Namespace (DEV)</text>
  <text x="390" y="208" text-anchor="middle" font-size="10" fill="#5a6b7b">another instance / team</text>
  <text x="390" y="224" text-anchor="middle" font-size="10" fill="#5a6b7b">no policy enforcement</text>
  <text x="390" y="242" text-anchor="middle" font-size="9" fill="#8a97a4">own quota and access</text>

  <!-- Namespace PROD -->
  <rect x="540" y="162" width="200" height="92" rx="6" fill="#eef3ee" stroke="#4a9a5a"/>
  <text x="640" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c6a3a">Namespace (PROD)</text>
  <text x="640" y="208" text-anchor="middle" font-size="10" fill="#5a6b7b">production workloads</text>
  <text x="640" y="224" text-anchor="middle" font-size="10" fill="#5a6b7b">Kyverno policy enforced</text>
  <text x="640" y="242" text-anchor="middle" font-size="9" fill="#8a97a4">stricter; can expose apps</text>

  <text x="390" y="278" text-anchor="middle" font-size="11" fill="#5a6b7b">The model has two levels: Tenant then Namespaces.</text>
  <text x="390" y="294" text-anchor="middle" font-size="11" fill="#5a6b7b">PROD namespaces enforce Kyverno policy; DEV namespaces do not.</text>
</svg>
