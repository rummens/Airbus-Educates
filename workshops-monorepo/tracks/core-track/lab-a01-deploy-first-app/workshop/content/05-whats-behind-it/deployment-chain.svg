<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="sans-serif">
  <rect x="0" y="0" width="780" height="300" fill="#f5f7fa" stroke="#c5ced6"/>
  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2b3a">What one Deployment creates</text>

  <!-- Deployment -->
  <rect x="40" y="95" width="180" height="100" rx="6" fill="#e8f0f7" stroke="#3b7dd8"/>
  <text x="130" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4a86">Deployment</text>
  <text x="130" y="152" text-anchor="middle" font-size="11" fill="#5a6b7b">you declare it</text>
  <text x="130" y="170" text-anchor="middle" font-size="10" fill="#8a97a4">replicas: 1</text>

  <!-- ReplicaSet -->
  <rect x="300" y="95" width="180" height="100" rx="6" fill="#eef3ee" stroke="#4a9a5a"/>
  <text x="390" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c6a3a">ReplicaSet</text>
  <text x="390" y="152" text-anchor="middle" font-size="11" fill="#5a6b7b">keeps N Pods</text>
  <text x="390" y="170" text-anchor="middle" font-size="10" fill="#8a97a4">created for you</text>

  <!-- Pod -->
  <rect x="560" y="95" width="180" height="100" rx="6" fill="#ffffff" stroke="#8aa0b4"/>
  <text x="650" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2b3a">Pod</text>
  <text x="650" y="152" text-anchor="middle" font-size="11" fill="#5a6b7b">runs your container</text>
  <text x="650" y="170" text-anchor="middle" font-size="10" fill="#8a97a4">the live workload</text>

  <g stroke="#5a6b7b" stroke-width="2" fill="#5a6b7b">
    <line x1="220" y1="145" x2="298" y2="145"/><polygon points="298,145 290,141 290,149"/>
    <line x1="480" y1="145" x2="558" y2="145"/><polygon points="558,145 550,141 550,149"/>
  </g>
  <text x="259" y="135" text-anchor="middle" font-size="9" fill="#8a97a4">creates</text>
  <text x="519" y="135" text-anchor="middle" font-size="9" fill="#8a97a4">creates</text>

  <text x="390" y="235" text-anchor="middle" font-size="11" fill="#5a6b7b">You manage the Deployment. It owns a ReplicaSet; the ReplicaSet owns the Pods.</text>
  <text x="390" y="255" text-anchor="middle" font-size="11" fill="#5a6b7b">Tied together by labels and a selector — change the Deployment and the chain reconciles.</text>
</svg>
