<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="sans-serif">
  <rect x="0" y="0" width="820" height="320" fill="#f5f7fa" stroke="#c5ced6"/>
  <text x="410" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2b3a">From "I need a namespace" to a working namespace</text>

  <!-- 1. pick the portal -->
  <rect x="20" y="52" width="180" height="100" rx="6" fill="#e8f0f7" stroke="#3b7dd8"/>
  <text x="110" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b4a86">1. Your myITSM portal</text>
  <text x="110" y="97" text-anchor="middle" font-size="10" fill="#5a6b7b">one per location:</text>
  <text x="110" y="113" text-anchor="middle" font-size="10" fill="#5a6b7b">DE · ES · DIV · …</text>
  <text x="110" y="136" text-anchor="middle" font-size="9" fill="#8a97a4">request in your own domain</text>

  <!-- 2. tenant -->
  <rect x="230" y="52" width="180" height="100" rx="6" fill="#e8f0f7" stroke="#3b7dd8"/>
  <text x="320" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b4a86">2. New tenant</text>
  <text x="320" y="97" text-anchor="middle" font-size="10" fill="#5a6b7b">owner · name · members</text>
  <text x="320" y="113" text-anchor="middle" font-size="10" fill="#5a6b7b">siglum · purpose · location</text>
  <text x="320" y="136" text-anchor="middle" font-size="9" fill="#8a97a4">do this first — once per tenant</text>

  <!-- 3. namespace -->
  <rect x="440" y="52" width="180" height="100" rx="6" fill="#e8f0f7" stroke="#3b7dd8"/>
  <text x="530" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b4a86">3. New namespace</text>
  <text x="530" y="97" text-anchor="middle" font-size="10" fill="#5a6b7b">for an existing tenant</text>
  <text x="530" y="113" text-anchor="middle" font-size="10" fill="#5a6b7b">basic · DevSpace · custom</text>
  <text x="530" y="136" text-anchor="middle" font-size="9" fill="#8a97a4">repeat per namespace</text>

  <!-- 4. automation -->
  <rect x="650" y="52" width="150" height="100" rx="6" fill="#eef3ee" stroke="#4a9a5a"/>
  <text x="725" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c6a3a">4. DCS provisions</text>
  <text x="725" y="97" text-anchor="middle" font-size="10" fill="#5a6b7b">automated on the</text>
  <text x="725" y="113" text-anchor="middle" font-size="10" fill="#5a6b7b">DCS side</text>
  <text x="725" y="136" text-anchor="middle" font-size="9" fill="#8a97a4">then you can use oc</text>

  <!-- arrows -->
  <g stroke="#5a6b7b" stroke-width="2" fill="#5a6b7b">
    <line x1="200" y1="102" x2="222" y2="102"/><polygon points="230,102 220,97 220,107"/>
    <line x1="410" y1="102" x2="432" y2="102"/><polygon points="440,102 430,97 430,107"/>
    <line x1="620" y1="102" x2="642" y2="102"/><polygon points="650,102 640,97 640,107"/>
  </g>

  <!-- default namespace note -->
  <g stroke="#8a97a4" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <path d="M320 152 L320 190 L530 190 L530 160"/>
  </g>
  <polygon points="530,152 525,162 535,162" fill="#8a97a4"/>
  <text x="425" y="208" text-anchor="middle" font-size="10" fill="#5a6b7b">A tenant already comes with one default namespace — step 3 is for every namespace after that.</text>

  <text x="410" y="248" text-anchor="middle" font-size="11" fill="#5a6b7b">The form asks a lot because there is no self-service UI yet: the answers ARE the input</text>
  <text x="410" y="266" text-anchor="middle" font-size="11" fill="#5a6b7b">to an automated onboarding pipeline, not notes for a human to interpret.</text>
  <text x="410" y="294" text-anchor="middle" font-size="11" fill="#5a6b7b">Unsure about a field? Leave the default and ask in "Further details" at the end of the form.</text>
</svg>
