apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: tour-b05-autoscaling
  labels:
    academy.dcs/track: build
    # Sits directly after the terminal lab it complements.
    academy.dcs/order: "55"
    academy.dcs/lab-format: console
    # Optional: the catalog badges it, leaves it out of the "Lab N of M" counter, and
    # does not require it for the track trophy.
    academy.dcs/optional: "true"
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/display-name: "Autoscaling in the console"
    academy.dcs/duration: "8 min"
    academy.dcs/difficulty: intermediate
    academy.dcs/icon: monitor
    academy.dcs/summary: >-
      Read an autoscaler's bounds, its current utilisation, and the conditions that say why it is
      or is not acting.
    academy.dcs/details: |
      ### What this lab is

      An optional console companion to **Autoscaling**. It opens the OpenShift web console and
      highlights each step on the real page. You type nothing.

      A Deployment with CPU requests and a HorizontalPodAutoscaler are created before the lab
      starts, so the numbers on screen are real.

      ### What you should already know

      The concepts, not the clicks. The HPA loop, requests as the denominator and the scale-in
      window are explained in **Autoscaling**.

      ### What you will do

      - Find HorizontalPodAutoscalers in the **Workloads** menu, where `oc get hpa` would list them
      - Read the min and max bounds, and the replica count it currently wants
      - Read the **Metrics** section: current utilisation as a percentage of the CPU request
      - Read the **Conditions**, which say whether it can read the metric and whether it may act
      - Open the Deployment it controls, whose replica count is no longer yours to set
      - Find **Add HorizontalPodAutoscaler** on that Deployment's Actions menu

      > **💡 Tip:** each step names the `oc` command the screen stands in for.

      ### When the console wins

      The conditions are three readable sentences here and a `jsonpath` query from a terminal,
      and they are what answers "why is it not scaling".

      ### Cleaning up

      Press **Finish** in the guidance box when you are done.
    academy.dcs/console-lab: tour-b05-autoscaling
    academy.dcs/orphaned: "0s"
    academy.dcs/expires: 60m
spec:
  title: "Autoscaling in the console"
  description: >-
    The console side of Autoscaling: an HPA's bounds, its utilisation against the CPU request,
    the conditions that explain its decision, and the Deployment whose replica count it owns.
  duration: 8m
  difficulty: intermediate
  labels:
    - name: module
      value: "B-Build-and-Run"
  workshop:
    # No content files: a console-lab learner never opens the dashboard. The session
    # exists to own the namespace and the objects the tour points at.
    image: "{{ .Values.workshopImages.base }}"
  session:
    namespaces:
      budget: medium
      security:
        token:
          enabled: true
    applications:
      terminal:
        enabled: false
      editor:
        enabled: false
      console:
        enabled: false
      slides:
        enabled: false
    objects:
      # A Deployment with a CPU request — without one an HPA has no denominator and
      # reports <unknown> forever, which would make this tour show nothing.
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: lab-app
          namespace: $(session_namespace)
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: lab-app
          template:
            metadata:
              labels:
                app: lab-app
                training.educates.dev/session.name: $(session_name)
            spec:
              containers:
                - name: app
                  image: "{{ .Values.workshopImages.sample }}"
                  ports:
                    - containerPort: 8080
                  resources:
                    requests: { cpu: 100m, memory: 64Mi }
                    limits: { cpu: 200m, memory: 128Mi }
      - apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        metadata:
          name: lab-app
          namespace: $(session_namespace)
        spec:
          scaleTargetRef:
            apiVersion: apps/v1
            kind: Deployment
            name: lab-app
          minReplicas: 1
          maxReplicas: 6
          metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 50
