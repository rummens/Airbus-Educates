# Hidden lab: needs a Deployment with CPU requests and an HPA to read, so it is launched
# from the academy portal with the namespace in the URL.
apiVersion: academy.dcs/v1alpha1
kind: ConsoleLab
metadata:
  name: tour-b05-autoscaling
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  title: Read an autoscaler's state
  description: >-
    Read a HorizontalPodAutoscaler's current utilisation against its target, its replica
    bounds, and the Deployment whose replica count it now owns.
  completionText: >-
    You read the numbers oc get hpa prints (current and target utilisation, min, max and
    desired replicas) and saw the Deployment whose replica count the HPA now sets.
  visibility: hidden
  mode: assisted
  context:
    primaryResource: labHpa
    resources:
      labHpa:
        apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        label: Lab autoscaler
        name: lab-app
        namespace: '<<namespace>>'
        listPath: '/k8s/ns/<<namespace>>/autoscaling~v2~HorizontalPodAutoscaler'
        consolePath: '/k8s/ns/<<namespace>>/horizontalpodautoscalers/lab-app'
      labDeployment:
        apiVersion: apps/v1
        kind: Deployment
        label: Lab deployment
        name: lab-app
        namespace: '<<namespace>>'
        consolePath: '/k8s/ns/<<namespace>>/deployments/lab-app'
  steps:
    - id: open-workloads
      title: Open Workloads
      description: >-
        HorizontalPodAutoscalers are listed under Workloads because each one sets the
        replica count of a workload.
      target: { type: quickStartId, value: qs-nav-workloads }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    - id: open-hpa-list
      title: Open HorizontalPodAutoscalers
      description: >-
        The entry is near the bottom of the Workloads menu, under the workload types
        themselves.
      target: { type: consoleElement, id: navigationLink, value: HorizontalPodAutoscalers }
      complete:
        operation: { type: activateTarget }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/autoscaling~v2~HorizontalPodAutoscaler' }
    - id: read-hpa-list
      title: Read the list
      description: >-
        This is what oc get hpa prints: the workload each autoscaler targets, and the
        replica bounds it may move within. The workload name in the row links to the
        Deployment the HPA controls.
      target: { type: consoleElement, id: pageContent }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: open-hpa
      title: Open the lab autoscaler
      description: >-
        Click the name. This page is oc describe hpa lab-app: the target workload, the
        bounds, the metrics and the conditions on one screen.
      target: { type: href, value: '/k8s/ns/<<namespace>>/horizontalpodautoscalers/lab-app' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/horizontalpodautoscalers/lab-app' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/horizontalpodautoscalers/lab-app' }
    - id: read-hpa-details
      title: Read the bounds and the decision
      description: >-
        Min and max are the range it may move within; the desired count is what it wants
        right now. An idle app stays at the
        minimum, as expected.
      target: { type: consoleElement, id: detailsSection, value: HorizontalPodAutoscaler details }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: read-hpa-metrics
      title: Read the Metrics section
      description: >-
        Current utilisation is a percentage of the CPU request, not of a core. A container
        that requests 100m and uses 50m reads as 50%. With no request there is nothing to
        take a percentage of, the value stays unknown, and the autoscaler never acts. That
        is the most common reason an HPA appears to do nothing.
      target: { type: consoleElement, id: detailsSection, value: Metrics }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: read-hpa-conditions
      title: Read the Conditions
      description: >-
        ScalingActive says whether it can read the metric at all. AbleToScale says whether
        it is allowed to act. ScalingLimited says it wanted to go further and hit min or
        max. Between them they explain why it is not scaling.
      target: { type: consoleElement, id: detailsSection, value: Conditions }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: open-deployment
      title: See what it controls
      description: >-
        The Deployment's replica count is no longer yours to set: change it here and the
        autoscaler will move it back on its next pass. This is expected: you gave the HPA
        control of the replica count.
      target: { type: href, value: '/k8s/ns/<<namespace>>/deployments/lab-app' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/deployments/lab-app' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/deployments/lab-app' }
    - id: find-add-hpa
      title: Find where an autoscaler is added
      description: >-
        The Actions menu has Add HorizontalPodAutoscaler, the console's version of oc
        autoscale. The form asks for exactly the three things the manifest declares: the
        target metric, and the minimum and maximum replicas.
      target: { type: consoleElement, id: actionsMenu }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
