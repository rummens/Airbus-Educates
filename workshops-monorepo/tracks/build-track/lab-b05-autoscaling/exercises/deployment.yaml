# The app the HorizontalPodAutoscaler will own. Two details matter for autoscaling:
#   * `replicas: 1` — once an HPA targets this Deployment, the HPA owns the replica
#     count. The value here is only the starting point.
#   * `resources.requests.cpu` — the DENOMINATOR of the HPA's utilisation maths. With
#     no CPU request there is nothing to be a percentage OF, and the HPA reports
#     <unknown> forever.
# Apply with: envsubst < deployment.yaml | oc apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-dcs
  labels:
    app: hello-dcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-dcs
  template:
    metadata:
      labels:
        app: hello-dcs
    spec:
      containers:
      - name: hello-dcs
        image: ${DCS_REGISTRY}/samples/hello-dcs:1.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
