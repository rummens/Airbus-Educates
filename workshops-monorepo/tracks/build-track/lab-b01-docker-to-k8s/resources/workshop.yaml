apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-b01-docker-to-k8s
  # --- DCS portal catalog metadata (this file is emitted verbatim; the portal
  #     reads these academy.dcs/* labels+annotations off metadata, NOT spec) ----
  labels:
    academy.dcs/track: build
    academy.dcs/order: "10"
    # No Route/Ingress created here (in-cluster only) → dev namespace.
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/icon: boxes
    academy.dcs/details: |
      **You know Docker. This lab translates that knowledge, it does not replace it.**

      You start from a real `docker-compose.yml` for the `hello-dcs` sample and migrate it
      onto DCS one object at a time: the container becomes a **Deployment**, `ports:`
      becomes a **Service**, `environment:` becomes a **ConfigMap**.

      Then you look at what is left over — four compose lines the platform refuses — and
      learn which control rejects each one.

      > **💡 Tip:** this is the on-ramp to the Build & Run track. Take it before the build
      > labs if compose is still your mental model.
spec:
  title: "From Docker to Kubernetes"
  description: Migrate a docker-compose file onto DCS object by object — container to Deployment, ports to Service, environment to ConfigMap — then meet the four lines the platform rejects.
  duration: 25m
  difficulty: intermediate
  labels:
    - name: module
      value: "B-Build-and-Run"
  publish:
    image: "$(image_repository)/lab-b01-docker-to-k8s-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md
  workshop:
    image: "{{ .Values.workshopImages.base }}"
    files:
    {{- if .Values.workshopContent.useGit }}
    - git:
        url: "{{ .Values.workshopContent.gitUrl }}"
        ref: "{{ .Values.workshopContent.gitRef }}"
      includePaths:
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b01-docker-to-k8s/workshop/**"
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b01-docker-to-k8s/exercises/**"
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b01-docker-to-k8s/README.md"
      newRootPath: "{{ trimPrefix "/" .Values.workshopContent.tracksRoot }}/build-track/lab-b01-docker-to-k8s"
    {{- else }}
    - image:
        url: "$(image_repository)/lab-b01-docker-to-k8s-files:$(workshop_version)"
    {{- end }}
  session:
    # DCS_REGISTRY: single terminal source for the sample-image registry (Plane 3).
    # Keep in sync with dcs_registry in workshop/config.yaml. Manifests carrying
    # ${DCS_REGISTRY} are applied via `envsubst < f.yaml | oc apply -f -`.
    env:
    - name: DCS_REGISTRY
      value: "harbor.example.dcs/dcs-academy"
    namespaces:
      budget: medium
      security:
        policy: restricted
        token:
          enabled: true
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      # A slide deck (workshop/slides/index.html renders workshop/slides/slides.md)
      # gives a visual, one-slide-per-page overview. Each content page links to its
      # slide with /slides/#<id>. The same files are served outside a session by the
      # portal's Slides button.
      slides:
        enabled: true
      examiner:
        enabled: true
      # Nothing cluster-scoped is created and the lesson is about workload objects,
      # not cluster topology — the session namespace IS the learner's workspace.
      vcluster:
        enabled: false
    # Feedback tab is pre-declared so it is ALWAYS visible, not created only on the
    # last page. Completion/trophies still fire solely when the form is SUBMITTED
    # (portal POST /feedback), so a permanently-visible tab does not mark the lab
    # done early. Page 98 opens this tab; it no longer creates it.
    dashboards:
    - name: Feedback
      url: "$(ingress_protocol)://academy.$(ingress_domain)/form?workshop=lab-b01-docker-to-k8s&session=$(session_namespace)"
