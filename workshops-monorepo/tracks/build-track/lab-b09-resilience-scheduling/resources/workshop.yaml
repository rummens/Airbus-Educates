apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-b09-resilience-scheduling
  labels:
    academy.dcs/track: build
    academy.dcs/order: "90"
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/icon: shield-check
    academy.dcs/details: |
      **The platform evicts Pods during maintenance. This lab covers how to avoid an outage when it does.**

      Node maintenance, upgrades and rebalancing evict Pods routinely. A PodDisruptionBudget sets
      how many may be evicted at once.

      You set a **PodDisruptionBudget** and read its status, which says how many Pods the
      platform may take right now. Scaling down takes that number to zero, and the lab shows what
      that then blocks.

      Then **shutdown**. You time a Pod's deletion and measure
      what a container that ignores `SIGTERM` costs.

      Last, **spreading** replicas across nodes, and the difference between a spread you prefer
      and one you require.

      > **⚠️ Watch out:** a budget that leaves the platform no room blocks the maintenance that
      > keeps the cluster patched.
spec:
  title: "Resilience & Scheduling"
  description: >-
    Limit planned disruption with a PodDisruptionBudget, measure what a container that ignores
    SIGTERM costs at shutdown, and spread replicas so losing one node does not take the app down.
  duration: 25m
  difficulty: intermediate
  labels:
    - name: module
      value: "B-Build-and-Run"
  publish:
    image: "$(image_repository)/lab-b09-resilience-scheduling-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md
  workshop:
    image: "{{ .Values.workshopImages.base }}"
    files:
    {{- if .Values.workshopContent.useGit }}
    - git:
        url: "{{ .Values.workshopContent.gitUrl }}"
        ref: "{{ .Values.workshopContent.gitRef }}"
      includePaths:
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b09-resilience-scheduling/workshop/**"
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b09-resilience-scheduling/exercises/**"
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b09-resilience-scheduling/README.md"
      newRootPath: "{{ trimPrefix "/" .Values.workshopContent.tracksRoot }}/build-track/lab-b09-resilience-scheduling"
    {{- else }}
    - image:
        url: "$(image_repository)/lab-b09-resilience-scheduling-files:$(workshop_version)"
    {{- end }}
  session:
    env:
    - name: DCS_REGISTRY
      value: "harbor.example.dcs/dcs-academy"
    namespaces:
      budget: medium
      security:
        policy: restricted
        token:
          enabled: true
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      slides:
        enabled: true
      examiner:
        enabled: true
      vcluster:
        enabled: false
    dashboards:
    - name: Feedback
      url: "$(ingress_protocol)://academy.$(ingress_domain)/form?workshop=lab-b09-resilience-scheduling&session=$(session_namespace)"
