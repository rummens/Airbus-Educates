apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-b09-resilience-scheduling
  labels:
    academy.dcs/track: build
    academy.dcs/order: "90"
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/icon: shield-check
    academy.dcs/details: |
      **The platform will move your Pods. The question is whether that costs you an outage.**

      Node maintenance, upgrades and rebalancing are routine, and none of them ask your
      permission. What you get instead is a way to state your terms.

      You set a **PodDisruptionBudget** and watch its own status say how many Pods the
      platform may take right now — then scale down and watch that number drop to zero.

      Then the half most apps get wrong: **shutdown**. You time a Pod's deletion and find
      out what a container that ignores `SIGTERM` actually costs.

      Last, **spreading** replicas across nodes, and the trade-off between a spread you
      prefer and one you require.

      > **⚠️ Watch out:** a budget that leaves the platform no room at all does not make
      > you safer — it blocks the maintenance that keeps the cluster patched.
spec:
  title: "Resilience & Scheduling"
  description: State your terms for planned disruption with a PodDisruptionBudget, learn what a container that ignores SIGTERM costs at shutdown, and spread replicas so one node's failure is not your outage.
  duration: 25m
  difficulty: intermediate
  labels:
    - name: module
      value: "B-Build-and-Run"
  publish:
    image: "$(image_repository)/lab-b09-resilience-scheduling-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md
  workshop:
    image: "{{ .Values.workshopImages.base }}"
    files:
    {{- if .Values.workshopContent.useGit }}
    - git:
        url: "{{ .Values.workshopContent.gitUrl }}"
        ref: "{{ .Values.workshopContent.gitRef }}"
      includePaths:
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b09-resilience-scheduling/workshop/**"
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b09-resilience-scheduling/exercises/**"
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b09-resilience-scheduling/README.md"
      newRootPath: "{{ trimPrefix "/" .Values.workshopContent.tracksRoot }}/build-track/lab-b09-resilience-scheduling"
    {{- else }}
    - image:
        url: "$(image_repository)/lab-b09-resilience-scheduling-files:$(workshop_version)"
    {{- end }}
  session:
    env:
    - name: DCS_REGISTRY
      value: "harbor.example.dcs/dcs-academy"
    namespaces:
      budget: medium
      security:
        policy: restricted
        token:
          enabled: true
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      slides:
        enabled: true
      examiner:
        enabled: true
      vcluster:
        enabled: false
    dashboards:
    - name: Feedback
      url: "$(ingress_protocol)://academy.$(ingress_domain)/form?workshop=lab-b09-resilience-scheduling&session=$(session_namespace)"
