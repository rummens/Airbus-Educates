apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: tour-b02-builds
  labels:
    academy.dcs/track: build
    # Sits directly after the terminal lab it complements.
    academy.dcs/order: "25"
    academy.dcs/lab-format: console
    # Optional: the catalog badges it, leaves it out of the "Lab N of M" counter, and
    # does not require it for the track trophy.
    academy.dcs/optional: "true"
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/display-name: "Builds in the console"
    academy.dcs/duration: "10 min"
    academy.dcs/difficulty: intermediate
    academy.dcs/icon: monitor
    academy.dcs/summary: >-
      Find a BuildConfig, start a build from the Actions menu, read its log, and see the
      ImageStream tag it produced.
    academy.dcs/details: |
      ### What this lab is

      An optional console companion to **Build Your Image on DCS**. It opens the OpenShift web
      console and highlights each step on the real page. You type nothing.

      A BuildConfig is created before the lab starts, so there is a real recipe to run.

      ### What you should already know

      The concepts, not the clicks. BuildConfig, Build and ImageStream are explained in **Build
      Your Image on DCS**. Nothing new is introduced here.

      ### What you will do

      - Open the **Builds** menu and see the three object types it holds
      - Read the BuildConfig list, one row per recipe rather than per run
      - Read a BuildConfig's source, strategy and output target
      - Start a build from the **Actions** menu, which is `oc start-build`
      - Open the run it created and read its log, which is `oc logs build/...`
      - Open the ImageStream, and read the tag that resolves to a digest

      > **💡 Tip:** each step names the `oc` command the screen stands in for.

      ### When the console wins

      For a failed build the log and the object that produced it are one click apart, and the
      history of every run is a list rather than a command.

      ### Cleaning up

      Press **Finish** in the guidance box when you are done. That records completion and shuts
      the project down.
    academy.dcs/console-lab: tour-b02-builds
    academy.dcs/orphaned: "0s"
    academy.dcs/expires: 60m
spec:
  title: "Builds in the console"
  description: >-
    The console side of Build Your Image: the Builds menu, a BuildConfig's strategy and output,
    a build started from the Actions menu, its log, and the ImageStream tag it produced.
  duration: 10m
  difficulty: intermediate
  labels:
    - name: module
      value: "B-Build-and-Run"
  workshop:
    # No content files: a console-lab learner never opens the dashboard. The session
    # exists to own the namespace and the objects the tour points at.
    image: "{{ .Values.workshopImages.base }}"
  session:
    namespaces:
      budget: medium
      security:
        token:
          enabled: true
    applications:
      terminal:
        enabled: false
      editor:
        enabled: false
      console:
        enabled: false
      slides:
        enabled: false
    objects:
      # An ImageStream and a BuildConfig so the tour has real objects to open. The
      # build itself is started by the learner in the console (the last step), which
      # is more honest than pre-running one: they see the Start build action do
      # something.
      - apiVersion: image.openshift.io/v1
        kind: ImageStream
        metadata:
          name: lab-built
          namespace: $(session_namespace)
          labels:
            app: lab-built
      - apiVersion: build.openshift.io/v1
        kind: BuildConfig
        metadata:
          name: lab-built
          namespace: $(session_namespace)
          labels:
            app: lab-built
        spec:
          source:
            type: Dockerfile
            # A Dockerfile source needs no git server and no upload: the content is
            # in the object, so a build can be started from the console with one
            # click and will actually succeed.
            dockerfile: |
              FROM {{ .Values.workshopImages.sample }}
              ENV GREETING="Built from the console"
          strategy:
            type: Docker
          output:
            to:
              kind: ImageStreamTag
              name: lab-built:latest
