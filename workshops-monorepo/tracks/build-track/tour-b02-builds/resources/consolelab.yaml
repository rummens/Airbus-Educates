# Hidden lab: it needs a BuildConfig to look at, so it is launched from the academy
# portal, which provisions the namespace and passes it in the URL:
#   /academy/lessons/tour-b02-builds/start?ns=<namespace>
# Only <<namespace>> is templated; the object names are owned by the paired
# workshop.yaml in this folder and are written out literally.
#
# Every href below is the form the console actually renders, read off a live 4.22:
# sidebar and tab links use the GVK form, table rows use the legacy plural. The engine
# matches an href target with a[href="<value>"], so the wrong form highlights nothing.
apiVersion: academy.dcs/v1alpha1
kind: ConsoleLab
metadata:
  name: tour-b02-builds
  annotations:
    # The CRD is owned by the console plugin's deployment, not this chart.
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  title: Follow a build through the console
  description: >-
    Find a BuildConfig, read its strategy and output, start a build, watch its log, and
    see the ImageStream tag the result landed under.
  completionText: >-
    You ran a build from the console and followed it to its output: the BuildConfig, the
    Build it created, its log, and the ImageStream tag the result was pushed to. These are
    the console versions of oc get bc, oc start-build, oc logs build and oc get imagestream.
  visibility: hidden
  mode: assisted
  context:
    primaryResource: labBuildConfig
    resources:
      labBuildConfig:
        apiVersion: build.openshift.io/v1
        kind: BuildConfig
        label: Lab build config
        name: lab-built
        namespace: '<<namespace>>'
        listPath: '/k8s/ns/<<namespace>>/build.openshift.io~v1~BuildConfig'
        consolePath: '/k8s/ns/<<namespace>>/buildconfigs/lab-built'
        tabs:
          builds: '/k8s/ns/<<namespace>>/buildconfigs/lab-built/builds'
          yaml: '/k8s/ns/<<namespace>>/buildconfigs/lab-built/yaml'
      labImageStream:
        apiVersion: image.openshift.io/v1
        kind: ImageStream
        label: Lab image stream
        name: lab-built
        namespace: '<<namespace>>'
        listPath: '/k8s/ns/<<namespace>>/image.openshift.io~v1~ImageStream'
        consolePath: '/k8s/ns/<<namespace>>/imagestreams/lab-built'
  steps:
    - id: open-builds-nav
      title: Open the Builds menu
      description: >-
        The Builds menu holds the three object types that turn source into a runnable
        image. BuildConfigs are the recipes. Builds are the runs. ImageStreams are where
        the results are tracked. Open it.
      target: { type: quickStartId, value: qs-nav-builds }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    - id: open-buildconfigs
      title: Open BuildConfigs
      description: >-
        Start with the recipes. This is oc get bc.
      target: { type: consoleElement, id: navigationLink, value: BuildConfigs }
      complete:
        operation: { type: activateTarget }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/build.openshift.io~v1~BuildConfig' }
    - id: read-buildconfig-list
      title: Read the list
      description: >-
        One row per recipe, not per run. The Last run column tells you when it was last
        used and how that run ended, so a recipe nobody has run since it was changed is
        visible here.
      target: { type: consoleElement, id: pageContent }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: open-buildconfig
      title: Open lab-built
      description: >-
        Click the name. This is the object you wrote in the terminal lab, rendered as a
        page.
      target: { type: href, value: '/k8s/ns/<<namespace>>/buildconfigs/lab-built' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/buildconfigs/lab-built' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/buildconfigs/lab-built' }
    - id: read-strategy
      title: Read the strategy and the output
      description: >-
        Three fields decide what this recipe does. The source says where the input comes
        from. The strategy says how the image is built, Docker here, meaning a
        Containerfile. The output names the ImageStream tag the finished image is pushed
        to. Change any of them and it is a different recipe, which is why the object belongs
        in git rather than being edited on this page.
      target: { type: consoleElement, id: detailsSection, value: BuildConfig details }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: open-actions
      title: Open the Actions menu
      description: >-
        Every details page in the console has an Actions menu in the top right, and what is
        in it depends on the object type. For a BuildConfig the first entry is the one you
        want.
      target: { type: consoleElement, id: actionsMenu }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    - id: start-build
      title: Start build
      description: >-
        This is oc start-build. It does not change the BuildConfig: it creates a new Build
        object, and that object is the record of one run. The page does not navigate
        anywhere, so press Next once you have clicked it.
      # No verification the engine can watch: 4.22 stays on the BuildConfig page after
      # Start build. The next step proves the build exists by opening it by name.
      target: { type: consoleElement, id: menuItem, value: Start build }
      complete:
        operation: { type: activateTarget }
        verify: { type: acknowledge }
    - id: open-builds-tab
      title: Open the Builds tab
      description: >-
        Every run of this recipe is listed here with its status and when it started. A
        failed run stays in the list, so you can open it later and read its log.
      target: { type: href, value: '/k8s/ns/<<namespace>>/buildconfigs/lab-built/builds' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/buildconfigs/lab-built/builds' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/buildconfigs/lab-built/builds' }
    - id: open-build
      title: Open lab-built-1
      description: >-
        Runs are numbered from one, in order. Open the run you just started.
      target: { type: href, value: '/k8s/ns/<<namespace>>/builds/lab-built-1' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/builds/lab-built-1' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/builds/lab-built-1' }
    - id: open-build-logs
      title: Open its Logs tab
      description: >-
        This is oc logs build/lab-built-1, and it streams while the build runs.
      target: { type: href, value: '/k8s/ns/<<namespace>>/builds/lab-built-1/logs' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/builds/lab-built-1/logs' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/builds/lab-built-1/logs' }
    - id: read-build-log
      title: Read the log
      description: >-
        The log has the three phases from the terminal lab. The input arrives. Each
        Containerfile instruction runs, and is echoed as it goes. The finished image is
        pushed to the output tag. A build that fails, fails in one of those three, and the
        line before the failure says which.
      target: { type: consoleElement, id: pageContent }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: open-imagestreams
      title: Open ImageStreams
      description: >-
        Back to the Builds menu for the last of its three entries. An ImageStream is the
        cluster's own record of an image: names and tags in here, bytes in the registry.
      target: { type: consoleElement, id: navigationLink, value: ImageStreams }
      complete:
        operation: { type: activateTarget }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/image.openshift.io~v1~ImageStream' }
    - id: open-imagestream
      title: Open lab-built
      description: >-
        The stream your build pushed to.
      target: { type: href, value: '/k8s/ns/<<namespace>>/imagestreams/lab-built' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/imagestreams/lab-built' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/imagestreams/lab-built' }
    - id: read-tags
      title: Read the Tags section
      description: >-
        The tag resolves to a digest. Tags move when a new build pushes the same tag; the
        digest is the image itself and never changes. A Deployment that refers to this
        ImageStream tag therefore picks up the new image on the next rollout, without
        anyone editing a registry URL.
      target: { type: consoleElement, id: detailsSection, value: Tags }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
