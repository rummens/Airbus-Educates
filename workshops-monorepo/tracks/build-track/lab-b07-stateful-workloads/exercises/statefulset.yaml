# A StatefulSet: the same container as a Deployment would run, plus three guarantees a
# Deployment cannot give.
#
#   serviceName          — the headless Service that provides each Pod's DNS name.
#   volumeClaimTemplates — ONE PersistentVolumeClaim PER REPLICA, created as
#                          data-hello-dcs-0, data-hello-dcs-1, … and re-attached to the
#                          same ordinal on restart. Not shared: each replica has its own.
#   ordered lifecycle    — hello-dcs-0 is Ready before hello-dcs-1 is created, and a
#                          rollout replaces Pods one at a time, highest ordinal first.
#
# The claim template sets no storageClassName, so the cluster's default class
# provisions the volume and the manifest stays portable. On DCS you would name the
# class the data's classification requires.
# Apply with: envsubst < statefulset.yaml | oc apply -f -
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hello-dcs
  labels:
    app: hello-dcs
spec:
  serviceName: hello-dcs
  replicas: 2
  selector:
    matchLabels:
      app: hello-dcs
  template:
    metadata:
      labels:
        app: hello-dcs
    spec:
      # The provisioned volume is root-owned and hello-dcs runs non-root (UID 1001).
      # fsGroup makes the kubelet chgrp the volume to 1001 and set g+w, so the app —
      # and your `oc exec` writes — can use it.
      securityContext:
        fsGroup: 1001
      containers:
      - name: hello-dcs
        image: ${DCS_REGISTRY}/samples/hello-dcs:1.0
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        # Inside the image's own writable home. A volume mounted at a root-level path
        # like /data stays root-owned and a non-root process cannot write it.
        - name: data
          mountPath: /opt/app-root/src/data
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
