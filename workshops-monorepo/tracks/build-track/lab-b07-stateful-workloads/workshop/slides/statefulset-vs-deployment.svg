<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="450" fill="#f5f7fa" stroke="#c5ced6"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2b3a">Interchangeable replicas, or replicas with an identity</text>

  <!-- Deployment side -->
  <rect x="24" y="48" width="344" height="176" rx="8" fill="#e8f0f7" stroke="#3b7dd8" stroke-width="2"/>
  <text x="196" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4a86">Deployment</text>
  <rect x="44" y="86" width="140" height="40" rx="6" fill="#ffffff" stroke="#3b7dd8"/>
  <text x="114" y="104" text-anchor="middle" font-size="10" fill="#1b4a86">hello-dcs-7f8b-x2k9p</text>
  <text x="114" y="118" text-anchor="middle" font-size="9" fill="#5a6b7b">generated name</text>
  <rect x="208" y="86" width="140" height="40" rx="6" fill="#ffffff" stroke="#3b7dd8"/>
  <text x="278" y="104" text-anchor="middle" font-size="10" fill="#1b4a86">hello-dcs-7f8b-q7m2t</text>
  <text x="278" y="118" text-anchor="middle" font-size="9" fill="#5a6b7b">generated name</text>

  <rect x="120" y="146" width="152" height="30" rx="6" fill="#eef3ee" stroke="#4a9a5a"/>
  <text x="196" y="166" text-anchor="middle" font-size="10" fill="#2c6a3a">one Service IP for both</text>

  <rect x="120" y="184" width="152" height="30" rx="6" fill="#fdf4e8" stroke="#c08a2d"/>
  <text x="196" y="204" text-anchor="middle" font-size="10" fill="#7a5410">one volume, shared (if any)</text>

  <text x="196" y="244" text-anchor="middle" font-size="11" fill="#5a6b7b">A replacement is as good as the original.</text>
  <text x="196" y="260" text-anchor="middle" font-size="11" fill="#5a6b7b">New name, new everything.</text>

  <!-- StatefulSet side -->
  <rect x="392" y="48" width="344" height="176" rx="8" fill="#eef3ee" stroke="#4a9a5a" stroke-width="2"/>
  <text x="564" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c6a3a">StatefulSet</text>
  <rect x="412" y="86" width="140" height="40" rx="6" fill="#ffffff" stroke="#4a9a5a"/>
  <text x="482" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c6a3a">hello-dcs-0</text>
  <text x="482" y="118" text-anchor="middle" font-size="9" fill="#2c6a3a">ordinal name, own DNS record</text>
  <rect x="576" y="86" width="140" height="40" rx="6" fill="#ffffff" stroke="#4a9a5a"/>
  <text x="646" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c6a3a">hello-dcs-1</text>
  <text x="646" y="118" text-anchor="middle" font-size="9" fill="#2c6a3a">ordinal name, own DNS record</text>

  <line x1="482" y1="126" x2="482" y2="150" stroke="#5a6b7b" stroke-width="2"/>
  <polygon points="482,150 478,142 486,142" fill="#5a6b7b"/>
  <line x1="646" y1="126" x2="646" y2="150" stroke="#5a6b7b" stroke-width="2"/>
  <polygon points="646,150 642,142 650,142" fill="#5a6b7b"/>

  <rect x="412" y="152" width="140" height="34" rx="6" fill="#fdf4e8" stroke="#c08a2d"/>
  <text x="482" y="167" text-anchor="middle" font-size="10" fill="#7a5410">data-hello-dcs-0</text>
  <text x="482" y="180" text-anchor="middle" font-size="9" fill="#7a5410">its own claim</text>
  <rect x="576" y="152" width="140" height="34" rx="6" fill="#fdf4e8" stroke="#c08a2d"/>
  <text x="646" y="167" text-anchor="middle" font-size="10" fill="#7a5410">data-hello-dcs-1</text>
  <text x="646" y="180" text-anchor="middle" font-size="9" fill="#7a5410">its own claim</text>

  <text x="564" y="208" text-anchor="middle" font-size="10" fill="#2c6a3a">hello-dcs-0 is Ready before hello-dcs-1 is created</text>
  <text x="564" y="244" text-anchor="middle" font-size="11" fill="#2c6a3a">A replacement for hello-dcs-0 is ALSO called hello-dcs-0,</text>
  <text x="564" y="260" text-anchor="middle" font-size="11" fill="#2c6a3a">and gets data-hello-dcs-0 back.</text>

  <!-- bottom: the three guarantees -->
  <rect x="24" y="286" width="712" height="142" rx="8" fill="#ffffff" stroke="#c5ced6" stroke-width="2"/>
  <text x="380" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b2b3a">The three guarantees, and the catch</text>
  <text x="44" y="334" font-size="11" fill="#1b2b3a">1. Stable identity — the ordinal name and its DNS record survive the Pod.</text>
  <text x="44" y="354" font-size="11" fill="#1b2b3a">2. Stable storage — volumeClaimTemplates makes one claim per replica; the claim belongs to the ORDINAL.</text>
  <text x="44" y="374" font-size="11" fill="#1b2b3a">3. Ordered lifecycle — created 0, 1, 2; rolled and scaled down highest-first, one at a time.</text>
  <text x="44" y="400" font-size="11" font-weight="bold" fill="#8a2f2c">Scaling down deletes the Pod and KEEPS the claim — on purpose, and it still counts against your quota.</text>
  <text x="44" y="418" font-size="11" fill="#5a6b7b">None of this makes the app highly available: replication, failover and backups stay the app's job, or an operator's.</text>
</svg>
