# The default type. One stable virtual IP in front of every Pod matching the selector;
# `type: ClusterIP` is what you get when you write no type at all.
apiVersion: v1
kind: Service
metadata:
  name: hello-dcs
  labels:
    app: hello-dcs
spec:
  type: ClusterIP
  selector:
    app: hello-dcs
  ports:
  - name: http
    port: 8080
    targetPort: 8080
