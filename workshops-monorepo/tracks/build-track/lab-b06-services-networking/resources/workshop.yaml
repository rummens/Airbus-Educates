apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-b06-services-networking
  labels:
    academy.dcs/track: build
    academy.dcs/order: "60"
    # In-cluster only: the lab reads about Routes but deliberately does not create one
    # (that needs a PROD-type namespace) → dev namespace.
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/icon: network
    academy.dcs/details: |
      **"Just expose it" hides five different answers.**

      A **Service** is not one thing. This lab walks the types a tenant can actually use
      on DCS — **ClusterIP**, **headless**, **ExternalName** — and the two you will be
      refused, **NodePort** and **LoadBalancer**, with the reason why.

      You resolve cluster DNS by hand to see what each type puts in DNS, watch endpoints
      follow Pod readiness, and finish on why the platform hands you a **Route** for
      anything that must be reachable from outside.

      > **💡 Tip:** the headless Service you meet here is the same one a StatefulSet needs
      > in the next lab.
spec:
  title: "Services & Cluster Networking"
  description: Take "expose it" apart — ClusterIP, headless and ExternalName Services, what each one puts in cluster DNS, why NodePort and LoadBalancer are refused on DCS, and where a Route fits.
  duration: 20m
  difficulty: intermediate
  labels:
    - name: module
      value: "B-Build-and-Run"
  publish:
    image: "$(image_repository)/lab-b06-services-networking-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md
  workshop:
    image: "{{ .Values.workshopImages.base }}"
    files:
    {{- if .Values.workshopContent.useGit }}
    - git:
        url: "{{ .Values.workshopContent.gitUrl }}"
        ref: "{{ .Values.workshopContent.gitRef }}"
      includePaths:
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b06-services-networking/workshop/**"
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b06-services-networking/exercises/**"
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b06-services-networking/README.md"
      newRootPath: "{{ trimPrefix "/" .Values.workshopContent.tracksRoot }}/build-track/lab-b06-services-networking"
    {{- else }}
    - image:
        url: "$(image_repository)/lab-b06-services-networking-files:$(workshop_version)"
    {{- end }}
  session:
    env:
    - name: DCS_REGISTRY
      value: "harbor.example.dcs/dcs-academy"
    namespaces:
      budget: medium
      security:
        policy: restricted
        token:
          enabled: true
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      slides:
        enabled: true
      examiner:
        enabled: true
      # Cluster DNS and Service endpoints are the subject; the session namespace is
      # where the learner's own Services live.
      vcluster:
        enabled: false
    dashboards:
    - name: Feedback
      url: "$(ingress_protocol)://academy.$(ingress_domain)/form?workshop=lab-b06-services-networking&session=$(session_namespace)"
