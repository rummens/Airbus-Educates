apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: tour-b04-health
  labels:
    academy.dcs/track: build
    # Sits directly after the terminal lab it complements.
    academy.dcs/order: "45"
    academy.dcs/lab-format: console
    # Optional: the catalog badges it, leaves it out of the "Lab N of M" counter, and
    # does not require it for the track trophy.
    academy.dcs/optional: "true"
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/display-name: "Health & resources in the console"
    academy.dcs/duration: "12 min"
    academy.dcs/difficulty: intermediate
    academy.dcs/icon: monitor
    academy.dcs/summary: >-
      Where the console keeps probes, resource numbers, Pod conditions and your namespace's quota and LimitRange.
    academy.dcs/details: |
      ### What this lab is

      An optional console companion to **Health & Resources**. It opens the OpenShift web
      console and highlights each step on the real page. You type nothing.

      An app is already running when the lab starts, with probes and resource numbers set,
      so every screen shows live values.

      ### What you should already know

      The concepts, not the clicks. Probes, requests, limits and the namespace budget are
      explained in **Health & Resources**.

      ### What you will do

      - Open the **Workloads** menu and see what it groups together
      - Read the Deployment list, where ready pods are counted against wanted pods
      - Find `readinessProbe`, `livenessProbe` and `resources` in the live YAML
      - Open a Pod that is Running but never Ready, and read its **Conditions**
      - Open the **Administration** menu, and your namespace's **ResourceQuota**
      - Read **Used** against **Max**, and what counts towards Used
      - Open the **LimitRange** and read the defaults an unsized container gets

      > **💡 Tip:** each step names the `oc` command the screen stands in for.

      ### One quota, one LimitRange

      A DCS namespace is created with exactly one ResourceQuota and exactly one LimitRange,
      and you cannot change either yourself. This training namespace lists a few extra
      quotas that the Academy's own tooling adds; the lab says which one to read.

      ### Cleaning up

      Press **Finish** in the guidance box when you are done. The namespace expires on its
      own.
    academy.dcs/console-lab: tour-b04-health
    academy.dcs/orphaned: "0s"
    academy.dcs/expires: 60m
spec:
  title: "Health & resources in the console"
  description: >-
    Where the console keeps probes and resource numbers, why a Pod can be Running and not Ready, and how to read your namespace's ResourceQuota and LimitRange.
  duration: 12m
  difficulty: intermediate
  labels:
    - name: module
      value: "B-Build-and-Run"
  workshop:
    # No content files: a console-lab learner never opens the dashboard. The session
    # exists to own the namespace and the objects the tour points at.
    image: "{{ .Values.workshopImages.base }}"
  session:
    namespaces:
      budget: medium
      security:
        token:
          enabled: true
    applications:
      terminal:
        enabled: false
      editor:
        enabled: false
      console:
        enabled: false
      slides:
        enabled: false
    objects:
      # An app with probes and explicit resources: the two things this tour reads off
      # the Pod template, and the reason its Pod shows real conditions.
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: lab-app
          namespace: $(session_namespace)
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: lab-app
          template:
            metadata:
              labels:
                app: lab-app
                training.educates.dev/session.name: $(session_name)
            spec:
              containers:
                - name: app
                  image: "{{ .Values.workshopImages.sample }}"
                  ports:
                    - containerPort: 8080
                  readinessProbe:
                    httpGet: { path: /healthz, port: 8080 }
                    initialDelaySeconds: 3
                    periodSeconds: 5
                  livenessProbe:
                    httpGet: { path: /healthz, port: 8080 }
                    initialDelaySeconds: 10
                    periodSeconds: 10
                  resources:
                    requests: { cpu: 50m, memory: 64Mi }
                    limits: { cpu: 100m, memory: 128Mi }
      # A Pod that is Running and never Ready: its readiness probe points at a path the
      # app does not serve. The tour opens it to show Conditions, which is the one place
      # the console distinguishes "the container is up" from "the pod is serving".
      # A BARE Pod, not a Deployment, because a console step can only target an anchor
      # whose href it knows in advance — a Deployment's pods carry a generated suffix.
      - apiVersion: v1
        kind: Pod
        metadata:
          name: lab-probe
          namespace: $(session_namespace)
          labels:
            app: lab-probe
            training.educates.dev/session.name: $(session_name)
        spec:
          containers:
            - name: app
              image: "{{ .Values.workshopImages.sample }}"
              ports:
                - containerPort: 8080
              readinessProbe:
                # Port 9090 is closed: the app listens on 8080 only. The probe is
                # refused a connection every time, so the pod never becomes Ready.
                httpGet: { path: /healthz, port: 9090 }
                initialDelaySeconds: 3
                periodSeconds: 5
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 100m, memory: 128Mi }
