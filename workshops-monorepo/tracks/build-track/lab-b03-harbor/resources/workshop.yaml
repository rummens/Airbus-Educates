apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-b03-harbor
  labels:
    academy.dcs/track: build
    academy.dcs/order: "30"
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/icon: database
    academy.dcs/details: |
      **On DCS the registry decides what may run. An image it will not serve cannot start.**

      You inspect an image without pulling it, request a **Harbor project** as a Kubernetes
      object through Crossplane's Harbor provider, copy an image between registries with
      `skopeo`, and read a vulnerability report field by field.

      Three rules govern the rest: which **catalogs** images may come from, the Harbor project
      your namespace may be given, and the asymmetry between the two namespace types. **A DEV
      project takes any push. A PROD project takes none, and serves only images below CVE
      severity 9.**

      The last page covers the two ways an image reaches PROD: a mirror from DEV, or the green
      catalog of images already cleared.

      > **⚠️ Watch out:** there is no `docker` and no `podman` in this lab, or on DCS. `skopeo`
      > talks to registries over their API, which is why it is the tool you are given.
spec:
  title: "Harbor: Projects, Push & Scan"
  description: >-
    Inspect and copy images with skopeo, request a Harbor project through Crossplane, read a
    vulnerability report, and learn the DCS registry rules: catalogs, DEV pushes, the PROD CVE
    gate and how promotion works.
  duration: 35m
  difficulty: intermediate
  labels:
    - name: module
      value: "B-Build-and-Run"
  publish:
    image: "$(image_repository)/lab-b03-harbor-files:$(workshop_version)"
    files:
    - directory:
        path: .
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md
  workshop:
    image: "{{ .Values.workshopImages.base }}"
    files:
    {{- if .Values.workshopContent.useGit }}
    - git:
        url: "{{ .Values.workshopContent.gitUrl }}"
        ref: "{{ .Values.workshopContent.gitRef }}"
      includePaths:
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b03-harbor/workshop/**"
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b03-harbor/exercises/**"
      - "{{ .Values.workshopContent.tracksRoot }}/build-track/lab-b03-harbor/README.md"
      newRootPath: "{{ trimPrefix "/" .Values.workshopContent.tracksRoot }}/build-track/lab-b03-harbor"
    {{- else }}
    - image:
        url: "$(image_repository)/lab-b03-harbor-files:$(workshop_version)"
    {{- end }}
  session:
    env:
    - name: DCS_REGISTRY
      value: "harbor.example.dcs/dcs-academy"
    - name: SESSION_NAMESPACE
      value: "$(session_namespace)"
    namespaces:
      budget: medium
      security:
        policy: restricted
        token:
          enabled: true
    # Copying an image INTO the cluster's own registry is the closest a training cluster
    # gets to "push to your DEV project", and it needs the image objects — which the
    # Educates session role does not grant. Same shape as the build lab's entitlement.
    objects:
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: image-pusher
        namespace: $(session_namespace)
      rules:
      - apiGroups: ["image.openshift.io"]
        resources: ["imagestreams", "imagestreams/layers", "imagestreamtags",
                    "imagestreamimages", "imagestreammappings", "imagestreamimports"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: image-pusher
        namespace: $(session_namespace)
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: image-pusher
      subjects:
      - kind: ServiceAccount
        name: $(service_account)
        namespace: $(workshop_namespace)
      - apiGroup: rbac.authorization.k8s.io
        kind: Group
        name: system:serviceaccounts:$(session_namespace)
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      slides:
        enabled: true
      examiner:
        enabled: true
      vcluster:
        enabled: false
    dashboards:
    - name: Feedback
      url: "$(ingress_protocol)://academy.$(ingress_domain)/form?workshop=lab-b03-harbor&session=$(session_namespace)"
