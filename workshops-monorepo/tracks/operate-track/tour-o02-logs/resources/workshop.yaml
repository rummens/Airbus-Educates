apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: tour-o02-logs
  labels:
    academy.dcs/track: operate
    # Sits directly after the terminal lab it complements.
    academy.dcs/order: "25"
    academy.dcs/lab-format: console
    # Optional: the catalog badges it, leaves it out of the "Lab N of M" counter, and
    # does not require it for the track trophy.
    academy.dcs/optional: "true"
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/display-name: "Logs in the console"
    academy.dcs/duration: "8 min"
    academy.dcs/difficulty: intermediate
    academy.dcs/icon: monitor
    academy.dcs/summary: >-
      Follow a Pod's log in the console, pause it, find the container selector, and read the
      events that explain what the log does not.
    academy.dcs/details: |
      ### What this lab is

      An optional console companion to **Logs**. It opens the OpenShift web console and highlights
      each step on the real page. You type nothing.

      A Pod that logs steadily is created before the lab starts, so the log view has something
      moving in it.

      ### What you should already know

      The concepts, not the clicks. The log path, `--previous` and aggregation are explained in
      **Logs**.

      ### What you will do

      - Open the **Workloads** menu and the Pod list, where `oc get pods` would list them
      - Read the Pod's details first: status and restart count, the context a log needs
      - Open the **Logs** tab, the console's `oc logs -f`
      - Pause the stream, search it, and read one line properly
      - Find the container selector, which is what `-c` does from a terminal
      - Open the **Events** tab, which is what the platform did to the Pod rather than what the app wrote

      > **💡 Tip:** each step names the `oc` command the screen stands in for.

      ### When the console wins

      The log sits one tab away from the events that explain a restart, and clicking between Pods
      is faster than retyping a command.

      ### Cleaning up

      Press **Finish** in the guidance box when you are done.
    academy.dcs/console-lab: tour-o02-logs
    academy.dcs/orphaned: "0s"
    academy.dcs/expires: 60m
spec:
  title: "Logs in the console"
  description: >-
    The console side of Logs: a Pod's status and restart count, its live log with pause and
    search, the container selector, and the events that explain what the log cannot.
  duration: 8m
  difficulty: intermediate
  labels:
    - name: module
      value: "O-Operate-and-Observe"
  workshop:
    # No content files: a console-lab learner never opens the dashboard. The session
    # exists to own the namespace and the objects the tour points at.
    image: "{{ .Values.workshopImages.base }}"
  session:
    namespaces:
      budget: medium
      security:
        token:
          enabled: true
    applications:
      terminal:
        enabled: false
      editor:
        enabled: false
      console:
        enabled: false
      slides:
        enabled: false
    objects:
      # A Pod with a STABLE name, so the tour can path-target its Logs tab (a Pod
      # created by a Deployment has a generated suffix). It logs every few seconds, so
      # the stream has something in it.
      - apiVersion: v1
        kind: Pod
        metadata:
          name: lab-logger
          namespace: $(session_namespace)
          labels:
            app: lab-logger
            training.educates.dev/session.name: $(session_name)
        spec:
          containers:
            - name: logger
              image: "{{ .Values.workshopImages.sample }}"
              command:
                - sh
                - -c
                - |
                  i=0
                  while true; do
                    i=$((i+1))
                    echo "[lab-logger] request ${i} served in $(( (i * 7) % 40 + 5 ))ms"
                    [ $((i % 9)) -eq 0 ] && echo "[lab-logger] WARN slow response, retrying" >&2
                    sleep 3
                  done
              resources:
                requests: { cpu: 25m, memory: 32Mi }
                limits: { cpu: 50m, memory: 64Mi }
              # A bare Pod is admitted by PodSecurity directly rather than through a
              # controller, so it has to say the restricted things out loud or the
              # console shows a policy warning next to a lab about reading logs.
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
