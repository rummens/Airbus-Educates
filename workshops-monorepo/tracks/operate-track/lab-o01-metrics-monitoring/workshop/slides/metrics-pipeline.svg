<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="450" fill="#f5f7fa" stroke="#c5ced6"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2b3a">Four hops, and who owns each one</text>

  <!-- free platform metrics -->
  <rect x="24" y="48" width="712" height="58" rx="8" fill="#e8f0f7" stroke="#3b7dd8" stroke-width="2"/>
  <text x="44" y="70" font-size="12" font-weight="bold" fill="#1b4a86">Infrastructure metrics — you get these for free, and cannot change them</text>
  <text x="44" y="92" font-size="11" fill="#1b4a86">CPU, memory, restarts, Pod phase, for every workload. They answer "is this Pod healthy", never "are requests failing".</text>

  <!-- the four hops -->
  <rect x="24" y="126" width="164" height="96" rx="8" fill="#eef3ee" stroke="#4a9a5a" stroke-width="2"/>
  <text x="106" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c6a3a">1. your app</text>
  <text x="106" y="170" text-anchor="middle" font-size="10" fill="#2c6a3a">serves /metrics</text>
  <text x="106" y="186" text-anchor="middle" font-size="10" fill="#2c6a3a">counters and gauges</text>
  <text x="106" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c6a3a">YOURS</text>

  <rect x="206" y="126" width="164" height="96" rx="8" fill="#eef3ee" stroke="#4a9a5a" stroke-width="2"/>
  <text x="288" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c6a3a">2. ServiceMonitor</text>
  <text x="288" y="170" text-anchor="middle" font-size="10" fill="#2c6a3a">which Service, which port</text>
  <text x="288" y="186" text-anchor="middle" font-size="10" fill="#2c6a3a">how often</text>
  <text x="288" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c6a3a">YOURS, in your namespace</text>

  <rect x="388" y="126" width="164" height="96" rx="8" fill="#fdf4e8" stroke="#c08a2d" stroke-width="2"/>
  <text x="470" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5410">3. monitoring</text>
  <text x="470" y="170" text-anchor="middle" font-size="10" fill="#7a5410">notices it, scrapes,</text>
  <text x="470" y="186" text-anchor="middle" font-size="10" fill="#7a5410">stores the samples</text>
  <text x="470" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5410">PLATFORM</text>

  <rect x="570" y="126" width="166" height="96" rx="8" fill="#fdf4e8" stroke="#c08a2d" stroke-width="2"/>
  <text x="653" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5410">4. query endpoint</text>
  <text x="653" y="170" text-anchor="middle" font-size="10" fill="#7a5410">serves it back, scoped</text>
  <text x="653" y="186" text-anchor="middle" font-size="10" fill="#7a5410">to namespaces you may read</text>
  <text x="653" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5410">PLATFORM</text>

  <line x1="188" y1="174" x2="202" y2="174" stroke="#5a6b7b" stroke-width="2"/>
  <polygon points="202,174 194,170 194,178" fill="#5a6b7b"/>
  <line x1="370" y1="174" x2="384" y2="174" stroke="#5a6b7b" stroke-width="2"/>
  <polygon points="384,174 376,170 376,178" fill="#5a6b7b"/>
  <line x1="552" y1="174" x2="566" y2="174" stroke="#5a6b7b" stroke-width="2"/>
  <polygon points="566,174 558,170 558,178" fill="#5a6b7b"/>

  <!-- tenancy -->
  <rect x="24" y="244" width="712" height="86" rx="8" fill="#eef3ee" stroke="#4a9a5a" stroke-width="2"/>
  <text x="380" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c6a3a">The query endpoint is tenant-scoped</text>
  <text x="44" y="292" font-size="11" fill="#2c6a3a">Ask about YOUR namespace with your session token: answered. It authorizes exactly as "may you read Pods here" does.</text>
  <text x="44" y="312" font-size="11" fill="#8a2f2c">Ask about someone else's: Forbidden. The metrics boundary IS the RBAC boundary — not a separate system to configure.</text>

  <!-- silent failure -->
  <rect x="24" y="348" width="712" height="78" rx="8" fill="#fdeeee" stroke="#c0504d" stroke-width="2"/>
  <text x="380" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2f2c">The one failure that gives you nothing to read</text>
  <text x="44" y="396" font-size="11" fill="#8a2f2c">A ServiceMonitor whose selector matches no Service, or which names a port the Service does not, reports NO error.</text>
  <text x="44" y="416" font-size="11" fill="#8a2f2c">No error, no data, no clue. Checking the selector and the port name by hand is the entire debugging technique.</text>
</svg>
