# The Service a ServiceMonitor selects. Two details matter for scraping:
#   * the `app: hello-dcs` label — the ServiceMonitor's selector matches THE SERVICE,
#     not the Pods, and then follows it to the endpoints;
#   * the NAMED port `http` — a ServiceMonitor refers to the port by name, so an
#     unnamed port cannot be scraped.
apiVersion: v1
kind: Service
metadata:
  name: hello-dcs
  labels:
    app: hello-dcs
spec:
  selector:
    app: hello-dcs
  ports:
  - name: http
    port: 8080
    targetPort: http
