# Track metadata → one Track CR. `id` is EXPLICIT (not the folder name), so the
# folder can be renamed freely. A workshop joins this track with label
# academy.dcs/track: <id>. Only `id` + `title` are required; the rest have
# defaults (order 100, icon "layers").
id: operate          # track id — must equal the workshops' academy.dcs/track label
title: "Operate & Observe — Run It on DCS"
description: "See what your app is doing with metrics and logs, and learn the platform mechanics behind your namespaces."
order: 25            # after Build & Run, before Security (30)
icon: gauge          # FA-style icon name the portal vendors

# Published 5 labs, all live-verified 2026-09-11. Every lab's examiner checks pass end to end against a real
# cluster; see dcs-academy/planning/course-module-o.md.
availability: available
