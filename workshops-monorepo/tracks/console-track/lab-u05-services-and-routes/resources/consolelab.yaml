# Hidden lab: needs a namespace holding a Service, a Route and a NetworkPolicy, so it is
# launched from the academy portal:
#   /academy/lessons/lab-u05-services-and-routes/start?ns=<namespace>
# Only <<namespace>> is templated; the object names are owned by the paired workshop.yaml
# in this folder and written out literally.
apiVersion: academy.dcs/v1alpha1
kind: ConsoleLab
metadata:
  name: lab-u05-services-and-routes
  annotations:
    # The CRD is owned by the console plugin's deployment, not this chart.
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  title: Follow the traffic chain in the console
  description: >-
    Walk from Route to Service to pods on screen, and see which screen shows a broken
    chain first.
  completionText: >-
    Done. You followed a request backwards from the Route to the Service to the pods the
    selector matched, and saw where the platform's own NetworkPolicies sit. Those four
    screens show what oc get route, oc get service and oc get endpoints print.
  visibility: hidden
  mode: assisted
  context:
    primaryResource: labService
    resources:
      labService:
        apiVersion: v1
        kind: Service
        label: Lab service
        name: lab-app
        namespace: '<<namespace>>'
        listPath: '/k8s/ns/<<namespace>>/core~v1~Service'
        consolePath: '/k8s/ns/<<namespace>>/services/lab-app'
      labRoute:
        apiVersion: route.openshift.io/v1
        kind: Route
        label: Lab route
        name: lab-app
        namespace: '<<namespace>>'
        listPath: '/k8s/ns/<<namespace>>/route.openshift.io~v1~Route'
        consolePath: '/k8s/ns/<<namespace>>/routes/lab-app'
  steps:
    - id: open-networking
      title: Open Networking
      description: >-
        Networking holds the objects that make an application reachable: Services for a
        stable in-cluster address, Routes for a URL outside the cluster. You worked through
        exactly this chain from the terminal in Expose Your App.
      target: { type: quickStartId, value: qs-nav-networking }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    - id: open-services
      title: Open Services
      description: >-
        Start at the inside of the chain. A Service is the stable name and address that
        survives pods being replaced.
      target: { type: consoleElement, id: navigationLink, value: Services }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/core~v1~Service' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/core~v1~Service' }
    - id: open-service
      title: Open the lab service
      description: >-
        The list is oc get service with its ports and cluster IP. Open the lab service to see
        its selector, which decides whether the Service works.
      target: { type: href, value: '/k8s/ns/<<namespace>>/services/lab-app' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/services/lab-app' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/services/lab-app' }
    - id: read-service-routing
      title: Read the selector
      description: >-
        Service routing shows the pod selector and the port mapping: which labels a pod must
        carry to receive this Service's traffic, and which container port each service port
        forwards to. Nothing here checks that any pod matches: a Service whose selector
        matches nothing looks healthy on this screen.
      target: { type: consoleElement, id: detailsSection, value: Service routing }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: open-service-pods
      title: See what the selector matched
      description: >-
        Open the Pods tab to see which pods this Service currently resolves to.
      target: { type: href, value: '/k8s/ns/<<namespace>>/services/lab-app/pods' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/services/lab-app/pods' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/services/lab-app/pods' }
    - id: read-service-pods
      title: This list is the endpoints
      description: >-
        These are the pods the selector matched, which is what oc get endpoints prints. If
        this list is empty, the Service answers nothing, and the cause is almost always a
        selector that no longer matches the labels the pods carry. Check this before you
        suspect the Route or the network.
      target: { type: consoleElement, id: pageContent }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: open-routes
      title: Open Routes
      description: >-
        Open Routes: a Route is the separate object that publishes the Service outside the
        cluster.
      target: { type: consoleElement, id: navigationLink, value: Routes }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/route.openshift.io~v1~Route' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/route.openshift.io~v1~Route' }
    - id: open-route
      title: Open the lab route
      description: >-
        The Location column carries the URL oc get route prints. Open the Route to see what
        that URL is attached to.
      target: { type: href, value: '/k8s/ns/<<namespace>>/routes/lab-app' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/routes/lab-app' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/routes/lab-app' }
    - id: read-route-details
      title: Host, service, port
      description: >-
        Route details names the DCS-managed hostname, the Service it forwards to and the
        target port, and the TLS settings below decide whether the platform terminates
        HTTPS. Read the chain end to end here: a Route with a valid host pointing at a
        Service with no endpoints still returns an error page to the user.
      target: { type: consoleElement, id: detailsSection, value: Route details }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: open-networkpolicies
      title: Look at the NetworkPolicies
      description: >-
        A connection can still fail when the Service and Route are both correct. Open
        NetworkPolicies to see the rules that decide which traffic reaches the pods; the
        platform team owns them.
      target: { type: consoleElement, id: navigationLink, value: NetworkPolicies }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/networking.k8s.io~v1~NetworkPolicy' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/networking.k8s.io~v1~NetworkPolicy' }
    - id: read-networkpolicies
      title: Read-only on DCS
      description: >-
        These policies decide which traffic may reach the pods in a project. On DCS you read
        them and the platform team owns them, so a change goes through an ITSM request rather
        than an oc apply. Knowing this screen exists is how you explain a connection that
        fails while the Service has endpoints and the Route is correct.
      target: { type: consoleElement, id: pageContent }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
