apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-u05-services-and-routes
  labels:
    academy.dcs/track: console
    academy.dcs/order: "50"
    # Console lab: the portal allocates this session for the namespace + objects
    # below, then redirects the learner into the OpenShift console instead of the
    # workshop dashboard. The academy console plugin guides them from there.
    academy.dcs/lab-format: console
    # PROD, not dev: this lab's session objects include a Route, and DCS only admits
    # external exposure in a PROD-type namespace (label_check.py enforces the pairing).
    dcs.airbus.com/lifecycle: prod
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/display-name: "Services & routes (console)"
    academy.dcs/duration: "10 min"
    academy.dcs/difficulty: beginner
    academy.dcs/icon: monitor
    academy.dcs/summary: >-
      Follow a request from Route to Service to pods in the OpenShift web console,
      and learn where a broken chain shows itself first.
    # A console lab has no workshop content, so there is no README for the portal to
    # fetch: this annotation is the course page's prospectus. Markdown, rendered.
    academy.dcs/details: |
      ### What this lab is

      A **console lab**. Instead of a terminal and instruction pages, the lab opens the
      OpenShift web console and walks you through it: the step you are on is highlighted
      on the real page, and the guidance box follows you as you navigate.

      Your own project is created before the lab starts, with an application, a Service, a
      Route and a NetworkPolicy already in place, so the whole traffic chain is live.

      ### What you should already know

      This lab assumes the concepts, not the clicks. You should have finished
      **Expose Your App**, where you gave an application a stable in-cluster address with
      a Service and published it with a Route. No new Kubernetes concepts are introduced
      here.

      ### What you will do

      You will not type any commands — this lab is entirely in the console. Each screen
      names the command it replaces, so you can map one onto the other afterwards.

      - Read a Service's selector and port mapping, where `oc get service` reports the address
      - Check what that selector actually matched on the Service's Pods tab — the screen behind
        `oc get endpoints`, and the first thing to look at when nothing answers
      - Open the Route that publishes it and read its host, target Service and TLS settings,
        the facts `oc get route` prints
      - Find the NetworkPolicies that decide what may reach these pods, and why on DCS you read
        them rather than write them

      ### When to reach for the console

      The console wins for following a chain: Route, Service and pods are one click apart,
      so an empty endpoint list is obvious in seconds. The CLI still wins for anything you
      need to repeat, script, or review — which is why the terminal labs come first.

      ### Cleaning up

      Press **Finish** in the guidance box when you are done. That records your completion
      and shuts the project down. Leaving the tab open just leaves it running until it
      expires.
    # The ConsoleLab CR (academy.dcs/v1alpha1, shipped by the console plugin repo)
    # this session drives. It templates only <<namespace>>, which the portal always
    # injects from the allocated session namespace, so there are no extra params.
    academy.dcs/console-lab: lab-u05-services-and-routes
    # A console-lab learner never opens the workshop dashboard, so Educates would
    # see the session as orphaned and reclaim it out from under them. A zero
    # duration disables that timer; `expires` remains the real lifetime bound.
    # The CRD pattern is ^\d+(s|m|h)$, so it must carry a unit: 0s, not 0.
    academy.dcs/orphaned: "0s"
    academy.dcs/expires: 60m
spec:
  title: "Services & routes (console)"
  description: >-
    You built the traffic chain from the terminal in Expose Your App — a Service for a
    stable in-cluster address, a Route for a URL outside it. This lab walks the same chain
    in the OpenShift web console, where a Service with no matching pods is visible at a
    glance, and ends at the NetworkPolicies that can block traffic the chain allows.
  duration: 10m
  difficulty: beginner
  labels:
    - name: module
      value: "A-Foundations"
  workshop:
    # No content files: nobody opens the dashboard for a console lab, so there are
    # no instruction pages to fetch or publish. The session pod exists only to own
    # the namespace and its objects.
    image: "{{ .Values.workshopImages.base }}"
  session:
    namespaces:
      budget: medium
      security:
        token:
          enabled: true
    # Nothing to click through in the dashboard — the lab happens in the console.
    applications:
      terminal:
        enabled: false
      editor:
        enabled: false
      console:
        enabled: false
      slides:
        enabled: false
    objects:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: lab-app
          namespace: $(session_namespace)
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: lab-app
          template:
            metadata:
              labels:
                app: lab-app
                # Makes the lab pods visible to the portal's readiness feed, which queries
                # this Educates session label — so the browser is not redirected to the
                # console before the workload the lab talks about is actually running.
                training.educates.dev/session.name: $(session_name)
            spec:
              containers:
                - name: app
                  image: "{{ .Values.workshopImages.sample }}"
                  ports:
                    - containerPort: 8080
                  resources:
                    requests:
                      cpu: 10m
                      memory: 64Mi
                    limits:
                      memory: 128Mi
      - apiVersion: v1
        kind: Service
        metadata:
          name: lab-app
          namespace: $(session_namespace)
        spec:
          selector:
            app: lab-app
          ports:
            - name: http
              port: 8080
              targetPort: 8080
      # The Route is the point of the lab, so it is created up front rather than left for
      # the learner: a console lab has no terminal to create one from. No host set — the
      # router assigns one from the cluster's application domain.
      - apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
          name: lab-app
          namespace: $(session_namespace)
        spec:
          to:
            kind: Service
            name: lab-app
          port:
            targetPort: http
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
      # Something to read on the last step. It matches what a DCS project gets in
      # practice: traffic from the router is allowed, so this policy does not break the
      # Route the previous steps just followed.
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-from-openshift-ingress
          namespace: $(session_namespace)
        spec:
          # Scoped to the lab's own pods, never `{}`: an empty selector would also cover
          # the Educates session pod that owns this namespace.
          podSelector:
            matchLabels:
              app: lab-app
          policyTypes:
            - Ingress
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      network.openshift.io/policy-group: ingress
