# Default lab: pure navigation, no namespaced resource paths, so it works for any
# authenticated user regardless of RBAC or selected project.
apiVersion: academy.dcs/v1alpha1
kind: ConsoleLab
metadata:
  name: tour-console-basics
  annotations:
    # The CRD is owned by the console plugin's deployment, not this chart.
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  title: Find your way around the console
  description: Locate the navigation groups that hold workloads, networking, and storage.
  completionText: >-
    Tour complete — you can find any resource group in the navigation, and you know that
    everything in them is scoped to one project.
  visibility: default
  mode: assisted
  steps:
    - id: open-workloads
      title: Open Workloads
      description: >-
        The Administrator navigation is grouped by what an object does. Workloads is the
        group for everything that runs your application.
      target: { type: quickStartId, value: qs-nav-workloads }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    - id: open-networking
      title: Open Networking
      description: >-
        The section expanded into its kinds — Deployments, Pods, Jobs, and the ConfigMaps and
        Secrets they read, the objects behind oc get deployment,pods. Next group: the ones
        that make an application reachable, Services inside the cluster and Routes outside it.
      target: { type: quickStartId, value: qs-nav-networking }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    - id: open-storage
      title: Open Storage
      description: >-
        Notice that Workloads closed as Networking opened: the navigation is an accordion,
        one group at a time. Third group, Storage — the PersistentVolumeClaims a workload
        makes for disk space that survives a restart.
      target: { type: quickStartId, value: qs-nav-storage }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    # Expanding Workloads/Networking/Storage collapses Home, so the Projects link has to be
    # brought back into view before the learner can be asked to click it.
    - id: open-home
      title: Open Home
      description: >-
        Those three groups are scoped to one project. Home is the group that is not: the
        cluster-wide views, including the list of projects you can reach and a search across
        every resource type.
      target: { type: quickStartId, value: qs-nav-home }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    # The project selector only renders on namespaced pages, so a lab that must work from any
    # page teaches the Projects list instead — it exists for every authenticated user.
    - id: open-projects
      title: Open your projects
      description: >-
        Every resource in the three groups above lives in a project. Open the list of yours.
      target: { type: consoleElement, id: navigationLink, value: Projects }
      complete:
        operation: { type: navigate, path: /k8s/cluster/projects }
        verify: { type: route, path: /k8s/cluster/projects }
    - id: read-projects
      title: Your projects, and only yours
      description: >-
        This is oc get projects: the projects your account may see, which on DCS is a
        deliberately short list. A project is a Kubernetes namespace with OpenShift's access
        rules on top, and it is the boundary for names, quota and permissions. Every
        resource page you open is scoped to one of these, chosen in the selector at the top
        of that page.
      target: { type: consoleElement, id: pageContent }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
