apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-u02-namespace-scope
  labels:
    academy.dcs/track: console
    academy.dcs/order: "20"
    # Console lab: the portal allocates this session for the namespaces below, then
    # redirects the learner into the OpenShift console instead of the workshop
    # dashboard. The academy console plugin guides them from there.
    academy.dcs/lab-format: console
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/display-name: "See the namespace boundary (console)"
    academy.dcs/duration: "10 min"
    academy.dcs/difficulty: beginner
    academy.dcs/icon: monitor
    academy.dcs/summary: >-
      Hold two projects at once in the OpenShift web console and watch the same
      resource name resolve to two independent objects.
    # A console lab has no workshop content, so there is no README for the portal to
    # fetch: this annotation is the course page's prospectus. Markdown, rendered.
    academy.dcs/details: |
      ### What this lab is

      A **console lab**. Instead of a terminal and instruction pages, the lab opens the
      OpenShift web console and walks you through it: the step you are on is highlighted
      on the real page, and the guidance box follows you as you navigate.

      Two projects are created for you before the lab starts, because the lesson only
      works with two: the same object name in both, belonging to neither.

      ### What you should already know

      This lab assumes the concepts, not the clicks. You should have finished
      **Terms — Namespaces & Tenancy**, where you deployed the same application into two
      namespaces and saw them stay independent. No new Kubernetes concepts are introduced
      here.

      ### What you will do

      > **💡 Tip:** you will not type any commands — this lab is entirely in the console.
      > Each screen names the `oc` command it replaces, so you can map one onto the other
      > afterwards.

      - Open an object in your first project and see that its identity is name **plus** namespace
      - Switch the project selector, the console's equivalent of `oc project`, to a second
        project
      - Find that project's own object carrying the same name
      - Compare the two pages — same kind, same name, different UID — and see why editing one
        cannot affect the other

      ### When to reach for the console

      The console wins here: the project selector makes scope visible at all times, which
      is exactly the thing that is invisible in a terminal until you check `oc project`.
      The CLI still wins for anything you need to repeat, script, or review.

      ### Cleaning up

      Press **Finish** in the guidance box when you are done. That records your completion
      and shuts both projects down.

      > **⚠️ Watch out:** leaving the tab open just leaves them running until they expire.
    academy.dcs/console-lab: lab-u02-namespace-scope
    # The second project the lab compares against. Its name is only knowable at launch
    # time, so the value carries the Educates variable and the portal substitutes the
    # allocated session namespace — it must match the secondary namespace named below
    # exactly. `ns` is never declared: the portal always injects it.
    academy.dcs/console-lab-params: secondNamespace=$(session_namespace)-two
    # A console-lab learner never opens the workshop dashboard, so Educates would
    # see the session as orphaned and reclaim it out from under them. A zero
    # duration disables that timer; `expires` remains the real lifetime bound.
    # The CRD pattern is ^\d+(s|m|h)$, so it must carry a unit: 0s, not 0.
    academy.dcs/orphaned: "0s"
    academy.dcs/expires: 60m
spec:
  title: "See the namespace boundary (console)"
  description: >-
    You proved namespace isolation from the terminal in Terms — Namespaces & Tenancy by
    running the same application in two namespaces. This lab does it in the OpenShift web
    console: two projects, one resource name, two independent objects — and the project
    selector that decides which one you are looking at.
  duration: 10m
  difficulty: beginner
  labels:
    - name: module
      value: "A-Foundations"
  workshop:
    # No content files: nobody opens the dashboard for a console lab, so there are
    # no instruction pages to fetch or publish. The session pod exists only to own
    # the namespaces.
    image: "{{ .Values.workshopImages.base }}"
  session:
    namespaces:
      budget: medium
      security:
        token:
          enabled: true
      # The second project. Educates creates and deletes it with the session, and the
      # learner is bound into it by the portal alongside the primary one. The name must
      # match console-lab-params above.
      secondary:
        - name: $(session_namespace)-two
          budget: small
    # Nothing to click through in the dashboard — the lab happens in the console.
    applications:
      terminal:
        enabled: false
      editor:
        enabled: false
      console:
        enabled: false
      slides:
        enabled: false
    # No objects: the lab compares kube-root-ca.crt, the trust bundle Kubernetes puts in
    # every namespace by itself. That is the point — the collision needs nothing created.
