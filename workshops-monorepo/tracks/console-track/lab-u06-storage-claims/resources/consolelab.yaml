# Hidden lab: needs a bound PersistentVolumeClaim and a pod that mounts it, so it is
# launched from the academy portal:
#   /academy/lessons/lab-u06-storage-claims/start?ns=<namespace>
# Only <<namespace>> is templated; the object names are owned by the paired workshop.yaml
# in this folder and written out literally. The mounting workload is a bare Pod so its
# exact name can be path-targeted.
apiVersion: academy.dcs/v1alpha1
kind: ConsoleLab
metadata:
  name: lab-u06-storage-claims
  annotations:
    # The CRD is owned by the console plugin's deployment, not this chart.
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  title: Read a storage claim in the console
  description: >-
    Find a PersistentVolumeClaim, read its capacity, access mode and class, and see which
    pod holds it.
  completionText: >-
    Done. You read a claim's capacity, access mode and class, found out from its events why a
    claim would stay Pending, and traced it to the path it is mounted at inside the pod —
    everything oc get pvc and oc describe pvc report.
  visibility: hidden
  mode: assisted
  context:
    primaryResource: labClaim
    resources:
      labClaim:
        apiVersion: v1
        kind: PersistentVolumeClaim
        label: Lab claim
        name: lab-data
        namespace: '<<namespace>>'
        listPath: '/k8s/ns/<<namespace>>/core~v1~PersistentVolumeClaim'
        consolePath: '/k8s/ns/<<namespace>>/persistentvolumeclaims/lab-data'
        tabs:
          events: '/k8s/ns/<<namespace>>/persistentvolumeclaims/lab-data/events'
      labPod:
        apiVersion: v1
        kind: Pod
        label: Mounting pod
        name: lab-app
        namespace: '<<namespace>>'
        listPath: '/k8s/ns/<<namespace>>/core~v1~Pod'
        consolePath: '/k8s/ns/<<namespace>>/pods/lab-app'
  steps:
    - id: open-storage
      title: Open Storage
      description: >-
        Storage holds the claims a project makes for durable disk space. You asked for one
        from the terminal in Storage; this is where the platform's answer is visible without
        printing YAML.
      target: { type: quickStartId, value: qs-nav-storage }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    - id: open-pvcs
      title: Open PersistentVolumeClaims
      description: >-
        A claim is a request for storage; the volume behind it is the platform's answer.
        Claims are what a project owns, so that is the list to open.
      target: { type: consoleElement, id: navigationLink, value: PersistentVolumeClaims }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/core~v1~PersistentVolumeClaim' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/core~v1~PersistentVolumeClaim' }
    - id: open-pvc
      title: Open the lab claim
      description: >-
        This list is oc get pvc, and its Status column is the only one that matters at a
        glance: Bound means a volume exists and can be mounted, Pending means nothing has
        satisfied the request. Open the claim for the rest.
      target: { type: href, value: '/k8s/ns/<<namespace>>/persistentvolumeclaims/lab-data' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/persistentvolumeclaims/lab-data' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/persistentvolumeclaims/lab-data' }
    - id: read-pvc-details
      title: Requested, granted, and by whom
      description: >-
        Requested size against granted capacity, the access mode, and the storage class that
        served it — the summary oc describe pvc prints. The class is the decision that
        matters on DCS: it selects File or Block and the performance tier, and it cannot be
        changed once the claim is bound. Getting it wrong means creating a new claim and
        copying the data.
      target:
        type: consoleElement
        id: detailsSection
        value: PersistentVolumeClaim details
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: open-pvc-events
      title: Check the claim's events
      description: >-
        A Bound claim needs no explanation. A Pending one gives its reason on the next tab.
      target: { type: href, value: '/k8s/ns/<<namespace>>/persistentvolumeclaims/lab-data/events' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/persistentvolumeclaims/lab-data/events' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/persistentvolumeclaims/lab-data/events' }
    - id: read-pvc-events
      title: Why a claim stays Pending
      description: >-
        This stream names the fault in the platform's own words: no storage class matched,
        the class has no provisioner, or the requested size cannot be satisfied. It is the
        first screen to open when a pod will not start and the reason mentions a volume — and
        on DCS the answer is often an ITSM request rather than a change you can make.
      target: { type: consoleElement, id: pageContent }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
    - id: open-workloads
      title: Open Workloads
      description: >-
        A claim on its own stores nothing. The other half of the story is the workload that
        mounts it, and that lives back under Workloads.
      target: { type: quickStartId, value: qs-nav-workloads }
      complete:
        operation: { type: activateTarget }
        verify: { type: targetAttribute, attribute: aria-expanded, value: 'true' }
    - id: open-pods
      title: Open Pods
      description: >-
        The claim named no consumer. The pod does, so go and find it there.
      target: { type: consoleElement, id: navigationLink, value: Pods }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/core~v1~Pod' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/core~v1~Pod' }
    - id: open-pod
      title: Open the mounting pod
      description: >-
        A pod that mounts a claim which is not yet Bound never reaches Running: it waits, and
        the reason appears on the pod rather than on the claim. Open this one.
      target: { type: href, value: '/k8s/ns/<<namespace>>/pods/lab-app' }
      complete:
        operation: { type: navigate, path: '/k8s/ns/<<namespace>>/pods/lab-app' }
        verify: { type: route, path: '/k8s/ns/<<namespace>>/pods/lab-app' }
    - id: read-pod-volumes
      title: Where the claim is mounted
      description: >-
        The Volumes section names the claim and the path it is mounted at — the pairing you
        wrote by hand in Storage, read back from the running object. This is the fact to check
        when data goes missing: anything written outside this path lives in the container
        filesystem and is gone the moment the pod is replaced.
      target: { type: consoleElement, id: detailsSection, value: Volumes }
      complete:
        operation: { type: none }
        verify: { type: acknowledge }
