apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-u01-container-access
  labels:
    academy.dcs/track: console
    academy.dcs/order: "10"
    # Console lab: the portal allocates this session for the namespace + objects
    # below, then redirects the learner into the OpenShift console instead of the
    # workshop dashboard. The academy console plugin guides them from there.
    academy.dcs/lab-format: console
    dcs.airbus.com/lifecycle: dev
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    academy.dcs/display-name: "Inspect a running container (console)"
    academy.dcs/duration: "10 min"
    academy.dcs/difficulty: beginner
    academy.dcs/icon: monitor
    academy.dcs/summary: >-
      Do the pod investigation you already know from the terminal — get pods, logs,
      rsh — in the OpenShift web console instead, guided step by step.
    # A console lab has no workshop content, so there is no README for the portal to
    # fetch: this annotation is the course page's prospectus. Markdown, rendered.
    academy.dcs/details: |
      ### What this lab is

      A **console lab**. Instead of a terminal and instruction pages, the lab opens the
      OpenShift web console and walks you through it: the step you are on is highlighted
      on the real page, and the guidance box follows you as you navigate.

      Your own project is created before the lab starts, with a running pod already in
      it, so everything you click is live — nothing is a screenshot or a simulation.

      ### What you should already know

      This lab assumes the concepts, not the clicks. You should have finished
      **Deploy Your First App** and **Configure & Troubleshoot Your App**, where you met
      pods, logs and container shells from the command line. Here you only map that
      knowledge onto the console — no new Kubernetes concepts are introduced.

      ### What you will do

      > **💡 Tip:** you will not type any commands — this lab is entirely in the console.
      > Each screen names the `oc` command it replaces, so you can map one onto the other
      > afterwards.

      - Read a project's pod list, where `oc get pods` would report it — and watch it refresh
        without a watch flag
      - Read the containers inside one pod: image, state, restart count, the part of
        `oc describe pod` that matters during an incident
      - Follow its live output on the **Logs** tab, the screen behind `oc logs -f`
      - Open a shell in the container from the **Terminal** tab, where `oc rsh` puts you — and
        learn the one rule about repairing anything from in there

      ### When to reach for the console

      The console wins for looking around: live status without re-running a command,
      related objects one click apart, and events beside the object they concern. The CLI
      still wins for anything you need to repeat, script, or review — which is why the
      terminal labs come first.

      ### Cleaning up

      Press **Finish** in the guidance box when you are done. That records your completion
      and shuts the project down.

      > **⚠️ Watch out:** leaving the tab open just leaves the project running until it
      > expires.
    # The ConsoleLab CR (academy.dcs/v1alpha1, shipped by the console plugin repo)
    # this session drives, plus the parameters it templates besides ns, which the
    # portal always injects from the allocated session namespace.
    academy.dcs/console-lab: lab-u01-container-access
    academy.dcs/console-lab-params: podName=lab-app
    # A console-lab learner never opens the workshop dashboard, so Educates would
    # see the session as orphaned and reclaim it out from under them. A zero
    # duration disables that timer; `expires` remains the real lifetime bound.
    # The CRD pattern is ^\d+(s|m|h)$, so it must carry a unit: 0s, not 0.
    academy.dcs/orphaned: "0s"
    academy.dcs/expires: 60m
spec:
  title: "Inspect a running container (console)"
  description: >-
    A guided tour of pod inspection in the OpenShift web console: locate a running
    pod, read its logs, and open a terminal inside its container. Runs in your own
    project, which is created and populated for you before the lab starts.
  duration: 10m
  difficulty: beginner
  labels:
    - name: module
      value: "A-Foundations"
  workshop:
    # No content files: nobody opens the dashboard for a console lab, so there are
    # no instruction pages to fetch or publish. The session pod exists only to own
    # the namespace and its objects.
    image: "{{ .Values.workshopImages.base }}"
  session:
    namespaces:
      budget: medium
      security:
        token:
          enabled: true
    # Nothing to click through in the dashboard — the lab happens in the console.
    applications:
      terminal:
        enabled: false
      editor:
        enabled: false
      console:
        enabled: false
      slides:
        enabled: false
    # The environment the learner is dropped into. Educates creates these with the
    # session and deletes them with it, so the lab is meaningful from the first
    # second and leaves nothing behind.
    objects:
      # A bare Pod, not a Deployment: the ConsoleLab navigates to an exact pod path
      # (/k8s/ns/<ns>/pods/lab-app), and a Deployment's generated pod suffix cannot
      # be templated into the lab. A 10-minute session needs no rescheduling.
      - apiVersion: v1
        kind: Pod
        metadata:
          name: lab-app
          namespace: $(session_namespace)
          labels:
            app: lab-app
            # Makes the lab pod visible to the portal's readiness feed, which queries
            # this Educates session label — so the browser is not redirected to the
            # console before the pod the lab talks about is actually running.
            training.educates.dev/session.name: $(session_name)
        spec:
          containers:
            - name: app
              image: "{{ .Values.workshopImages.sample }}"
              ports:
                - containerPort: 8080
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
      - apiVersion: v1
        kind: Service
        metadata:
          name: lab-app
          namespace: $(session_namespace)
        spec:
          selector:
            app: lab-app
          ports:
            - port: 8080
              targetPort: 8080
