# DCS Academy test pipeline.
#
# Two tiers, split by whether they need a cluster:
#   FAST (stage: test)     — no cluster; blocks merges. Every job carries `needs: []` so
#                            they all start at once instead of waiting on a stage boundary.
#   CLUSTER (stage: e2e)   — needs a live OpenShift/CRC runner (tag: crc); manual on MRs,
#                            automatic on scheduled pipelines. Does NOT block merges (cluster
#                            flakiness is not a code defect) — read its report before release.
#
# Selective triggering is done with `rules: changes:` (per-job) plus, for the cluster smoke
# job, test/ci/changed.py (only re-smokes the workshops whose files actually changed).
#
# AIR-GAPPED INSTALLS — three CI variables, no YAML edits:
#   CI_BASE_IMAGE   Harbor mirror of images/dcs-ci (python + git + curl + the portal's
#                   python deps, all baked — the jobs pip-install nothing at runtime).
#   LINK_CHECK_SKIP_EXTERNAL=true
#                   the runner cannot reach docs.openshift.com / kubernetes.io, so those
#                   links are counted and listed but not fetched. Everything else (relative
#                   targets, the placeholder-docs-URL guard) still runs.
#   DCS_DOCS_BASE_URL
#                   the real internal docs host. Without it the link check FAILS: a
#                   placeholder host means every DCS doc link ships as a 404.
#                   Add DCS_DOCS_CHECK_INTERNAL=true on a runner that can reach that host
#                   to fetch those links as well.
# If your runners only take tagged jobs, add `tags: [$RUNNER_TAG]` to `.fast` below —
# that is the one place the whole fast tier reads.

stages: [test, e2e]

variables:
  COVERAGE_MIN: "90"
  GIT_DEPTH: "0"                     # full history so changed.py can diff against the base
  # Single knob for the fast tier's image. Override as a CI variable to point at Harbor.
  CI_BASE_IMAGE: "ghcr.io/rummens/dcs-ci:dev"
  RUNNER_TAG: "saas-linux-small-amd64"   # only used by jobs that opt into tags

# `needs: []` = start immediately, in parallel with every other fast job. Without it a job
# waits for its whole stage predecessor set, which serialises the tier for no reason.
.fast:
  stage: test
  image:
    name: $CI_BASE_IMAGE
    # Runners cache a mutable tag like :dev forever, so a rebuilt image is never picked up
    # (that is how a stale image without the baked deps keeps failing). Two entries: the
    # runner takes `always` when its allowed_pull_policies permit it, and falls back to
    # `if-not-present` instead of erroring "pull_policy not allowed" when it doesn't.
    # A runner that refuses `always` needs `pull_policy = "always"` in its config.toml.
    pull_policy: [always, if-not-present]
  needs: []

# ---------- FAST TIER (no cluster, blocks merges) ----------

portal-tests:
  extends: .fast
  rules:
    - changes:
        - images/dcs-academy-portal/**/*
        - test/portal/**/*
        - test/ci/**/*
        - .gitlab-ci.yml
  before_script:
    # NO install step: the runner has no package index. Every dependency is baked into
    # CI_BASE_IMAGE (images/dcs-ci). This only asserts they are there, so a stale image
    # says so in one line instead of failing later as "unrecognized arguments: --cov".
    - python -c "import pytest_cov, flask, kubernetes, psycopg, markdown"
      || { echo "CI_BASE_IMAGE ($CI_BASE_IMAGE) is missing test deps — rebuild images/dcs-ci (images/build.sh) and re-mirror it to Harbor."; exit 1; }
  script:
    - bash test/ci/run-python.sh
  coverage: '/^TOTAL\s+.*\s+(\d+%)$/'

workshop-static:
  extends: .fast
  rules:
    - changes:
        - workshops-monorepo/**/*
        - test/workshops/**/*
        - test/ci/**/*
        - .gitlab-ci.yml
  script:
    # coverage: every workshop command has a smoke test (or an explicit exclude);
    # links: every link a learner can click — content, slides, exercises, README and
    #        console-lab CRs — resolves (200 / reachable / real docs host);
    # labels: each lab's dev/prod lifecycle label matches its Route usage.
    - bash test/ci/run-workshops.sh
  artifacts:
    # The same fix list the job prints last, downloadable: lab · file:line · reason · url.
    when: on_failure
    expire_in: 30 days
    paths: [link-failures.txt]

fix-examiner-perms:
  extends: .fast
  tags:
    - ${RUNNER_TAG}
  rules:
    # Branch pushes only. Our own fix commit carries [skip ci] so GitLab won't create
    # a pipeline for it (no recursion); excluding tags/MRs here is belt-and-suspenders.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"                 # full clone — clean push of the new commit
    BOT_NAME: "DCS CI perm-fixer"
    BOT_EMAIL: "ci-bot@dcs.local"
  script:
    - set -eu
    - |
      # examiner test files whose git-tracked mode is not 100755. Anchored on
      # /examiner/tests/ so it works at any nesting (tracks/ at root or deeper) and
      # catches subdir-prefixed tests too.
      bad=$(git ls-files -s | awk '$4 ~ /\/examiner\/tests\// && $1 != "100755" { print $4 }')
      if [ -z "$bad" ]; then
        echo "OK: every examiner test file is executable (100755). Nothing to fix."
        exit 0
      fi
      echo "Non-executable examiner tests (mode != 100755):"
      printf '  %s\n' $bad
      printf '%s\n' $bad | xargs git update-index --chmod=+x
      echo "Re-asserted +x on $(printf '%s\n' $bad | wc -l | tr -d ' ') file(s)."
    - |
      # Commit + push the mode fix back to the same branch. [skip ci] stops re-trigger.
      test -n "${GIT_PUSH_TOKEN:-}" || { echo "ERROR: GIT_PUSH_TOKEN unset (need a write_repository token)"; exit 1; }
      git config user.name  "$BOT_NAME"
      git config user.email "$BOT_EMAIL"
      git remote set-url origin "https://oauth2:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git commit -m "ci: chmod +x examiner test scripts [skip ci]"
      # HEAD:branch — CI runs on detached HEAD; push the new commit onto the branch ref.
      # No --force: if the branch advanced meanwhile the job fails instead of clobbering.
      git push origin "HEAD:${CI_COMMIT_BRANCH}"

# ---------- CLUSTER TIER (needs a crc runner; does not block merges) ----------

.cluster:
  stage: e2e
  tags: [crc]                        # a runner with `oc` logged in to the CRC/OpenShift test cluster
  needs: []                          # cluster tier doesn't consume the fast tier's output
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [workshops-monorepo/**/*, test/workshops/**/*]
      when: manual
      allow_failure: true

workshop-smoke:
  extends: .cluster
  script:
    # only the workshops whose files changed (full set on a scheduled run via CHANGED fallback)
    - bash test/ci/run-workshops.sh --changed --smoke

user-flow:
  extends: .cluster
  script:
    - python3 test/workshops/flow_test.py --mode both
